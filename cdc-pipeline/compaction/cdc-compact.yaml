# One-off full compaction of ONE CDC table in one format (cdc-compact.py), as a
# BATCH job. Rendered per format and table by compaction/run.sh into
# cdc-compact-<fmt>-<table>-deployed.yaml (git-ignored: bucket, account, role).
# Same pattern as throughput-benchmark/compaction/flink-cid-compact.yaml: the
# writers' image, EMR release, nodepools and catalog SQL; no HA, no restarts (a
# failed run commits nothing, run.sh reports it); a fresh CR per run (EMR stages
# the script on CREATE only).
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  namespace: ${NAMESPACE}
  name: ${NAME}
spec:
  flinkVersion: v1_20
  executionRoleArn: ${EMR_EXECUTION_ROLE_ARN}
  image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/emr-flink-cdc-paimon:${IMAGE_TAG}
  imagePullPolicy: IfNotPresent
  emrReleaseLabel: "emr-${EMR_VERSION}-flink-latest"

  flinkConfiguration:
    fs.s3a.endpoint.region: ${AWS_REGION}
    # /glue/confs/ in the pods: the Paimon catalog's hive-conf-dir (the Paimon
    # writer sets the same). Harmless for Iceberg (GlueCatalog).
    aws.glue.enabled: "true"
    job.autoscaler.enabled: "false"
    pipeline.operator-chaining.enabled: "true"
    # Retry, not fail, on a transient task error: the first Iceberg run on _v3r3
    # (2026-11-04) died 8.5 min into customers on one S3 "Unexpected end of file
    # from server" with restart-strategy none. Nothing commits until the rewrite
    # finishes, so a retry is safe.
    restart-strategy.type: fixed-delay
    restart-strategy.fixed-delay.attempts: "3"
    restart-strategy.fixed-delay.delay: "30s"
    # No JDK HTTP keep-alive: Iceberg's S3FileIO runs on the SDK's URLConnection
    # client (the image has no Apache5 client), and a rewrite's part uploads sit
    # idle while it applies millions of equality deletes. A reused connection the
    # server had closed failed UploadPart in expect100Continue ("Unexpected end
    # of file from server"), retries exhausted, ~6 min into every Iceberg run on
    # _v3writeonly (2026-11-05). A fresh connection per request costs a TLS
    # handshake per 16 MiB part.
    env.java.opts.jobmanager: "-Dhttp.keepAlive=false"
    # delete-num-threads 8, not Iceberg's default (32 seen on 8-cpu TaskManagers):
    # each thread copies a whole equality-delete file into heap before the set is
    # built, and the GC-locker stalls they caused preceded the OOMs (2026-11-06).
    env.java.opts.taskmanager: "-Dhttp.keepAlive=false -Diceberg.worker.delete-num-threads=8"
    heartbeat.timeout: "180s"
    heartbeat.interval: "20s"
    taskmanager.numberOfTaskSlots: "${TM_SLOTS}"
    taskmanager.memory.managed.fraction: "0.1"
    parallelism.default: "${COMPACT_PARALLELISM}"
    pipeline.max-parallelism: "128"
    # Iceberg: the groups to rewrite travel inside the job graph.
    pekko.framesize: "104857600b"
    jobmanager.memory.jvm-metaspace.size: "512m"

  jobManager:
    highAvailabilityEnabled: false
    replicas: 1
    resource:
      memory: 8Gi
      cpu: 4
    podTemplate:
      spec:
        nodeSelector:
          karpenter.sh/capacity-type: on-demand
          karpenter.sh/nodepool: ${JM_NODEPOOL}
        containers:
        - name: flink-main-container
          env:
          # Read by the writers' 01-catalog-setup.sql.
          - name: PAIMON_WAREHOUSE
            value: "s3://${BUCKET_NAME}/paimon-warehouse/"
          - name: ICEBERG_WAREHOUSE
            value: "s3://${BUCKET_NAME}/iceberg-warehouse/"
          - name: GLUE_DATABASE
            value: "${GLUE_DATABASE}"
          - name: ICEBERG_FORMAT_VERSION
            value: "${ICEBERG_FORMAT_VERSION}"
          - name: AWS_REGION
            value: "${AWS_REGION}"
          - name: AWS_DEFAULT_REGION
            value: "${AWS_REGION}"
          - name: S3A_MULTIPART_SIZE
            value: "${S3A_MULTIPART_SIZE}"
          - name: S3A_MULTIPART_THRESHOLD
            value: "${S3A_MULTIPART_THRESHOLD}"
          - name: S3A_ACTIVE_BLOCKS
            value: "${S3A_ACTIVE_BLOCKS}"
          - name: ICEBERG_S3_MULTIPART_SIZE_BYTES
            value: "${ICEBERG_S3_MULTIPART_SIZE_BYTES}"
          - name: ICEBERG_S3_MULTIPART_THREADS
            value: "${ICEBERG_S3_MULTIPART_THREADS}"
  taskManager:
    resource:
      memory: ${TM_MEMORY}
      cpu: ${TM_CPU}
    podTemplate:
      metadata:
        annotations:
          karpenter.sh/do-not-disrupt: "true"
      spec:
        containers:
        - name: flink-main-container
          env:
          - name: AWS_REGION
            value: "${AWS_REGION}"
          - name: AWS_DEFAULT_REGION
            value: "${AWS_REGION}"
        nodeSelector:
          karpenter.sh/capacity-type: on-demand
          karpenter.sh/nodepool: ${TM_NODEPOOL}

  job:
    jarURI: s3://${BUCKET_NAME}/flink/scripts/cdc-compact.py
    entryClass: org.apache.flink.client.python.PythonDriver
    args:
      - "-py"
      - "/opt/flink/usrlib/cdc-compact.py"
      - "--format"
      - "${FMT}"
      - "--table"
      - "${TABLE}"
      - "--catalog-sql"
      - "s3://${BUCKET_NAME}/flink/sql-scripts/${FMT}/01-catalog-setup.sql"
      - "--parallelism"
      - "${COMPACT_PARALLELISM}"
      - "--max-group-delete-keys"
      - "${ICEBERG_MAX_GROUP_DELETE_KEYS}"
      - "--result-uri"
      - "${RESULT_URI}"
    parallelism: ${COMPACT_PARALLELISM}
    upgradeMode: stateless
    state: running

  monitoringConfiguration:
    s3MonitoringConfiguration:
      logUri: s3://${BUCKET_NAME}/flink/logs/cdc-compact${SESSION_SUFFIX}
    sideCarResources:
      limits:
        cpuLimit: 500m
        memoryLimit: 250Mi
