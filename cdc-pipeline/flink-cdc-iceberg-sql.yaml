apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  namespace: emr-flink
  name: flink-cdc-iceberg
spec:
  flinkVersion: v1_20
  executionRoleArn: ${EMR_EXECUTION_ROLE_ARN}
  image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/emr-flink-cdc-paimon:${IMAGE_TAG}
  imagePullPolicy: Always
  emrReleaseLabel: "emr-${EMR_VERSION}-flink-latest"

  flinkConfiguration:
    # S3 Configuration
    fs.s3a.endpoint.region: ${AWS_REGION}
    # scale down instantly to test the scaling up behavior, in production you might want to set it to a higher value to avoid too frequent scaling down
    # job.autoscaler.scale-down.interval: "0"
    # # restart with local-recovery is still needed
    # # in order to redistribute states, update DAG etc by adaptive-scheduler
    # job.autoscaler.restart.time-tracking.enabled: "true"
    job.autoscaler.scaling.enabled: "false"
    job.autoscaler.enabled: "false"
    # job.autoscaler.stabilization.interval: "1m"
    # job.autoscaler.metrics.window: "15m"
    # # lower these settings to trigger autoscaling earlier
    # job.autoscaler.target.utilization: "0.5"
    # job.autoscaler.target.utilization.boundary: "0.3"
    # job.autoscaler.restart.time: "2m"
    # job.autoscaler.catch-up.duration: "5m"
    # job.autoscaler.vertex.exclude.ids: ""
    pipeline.operator-chaining.enabled: "false"
    pipeline.auto-watermark-interval: "1s"
    # local-recovery
    execution.checkpointing.interval: "60s"
    execution.checkpointing.timeout: "600s"
    execution.checkpointing.min-pause: "30s"
    # Survive transient checkpoint failures during the initial snapshot instead of
    # failing the job. The snapshot phase reads 491M rows / 102 GiB from RDS, and a
    # checkpoint taken mid-snapshot has to persist large per-split backfill state; a
    # single timeout there is normal and is not a reason to restart 264 tasks. The
    # default is 0, meaning the very first failed checkpoint kills the job. Interval
    # itself stays at 60s — it is a fair-comparison variable and must match Paimon.
    execution.checkpointing.tolerable-failed-checkpoints: "10"
    state.backend.local-recovery: "true"
    # ebs local-recovery
    task.local-recovery.ebs.enable: "true"
    kubernetes.taskmanager.local-recovery.persistentVolumeClaim.sizeLimit: 10Gi
    execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
    # log-based incremental checkpoint
    state.backend.incremental: "true"
    state.changelog.enabled: "true"
    state.backend.changelog.storage: filesystem
    dstl.dfs.base-path: s3://${BUCKET_NAME}/flink/cdc-iceberg/changelog/
    dstl.dfs.upload.timeout: 5s
    state.backend.type: rocksdb
    state.backend.rocksdb.localdir: /tmp/rocksdb/
    # increase from default 50s to 3min to tolerate GC pauses during heavy commits
    heartbeat.timeout: "180s"
    heartbeat.interval: "20s"
    heartbeat.rpc-failure-threshold: "10"
    state.checkpoints.dir: s3p://${BUCKET_NAME}/flink/cdc-iceberg/checkpoints/
    state.savepoints.dir: s3p://${BUCKET_NAME}/flink/cdc-iceberg/savepoints/
    # Restart Strategy
    # 'full', not 'region' — kept in lockstep with the Paimon job, where region
    # failover let Source: mysql_src_customers[1] subtask 0 die alone while the
    # other 15 stayed RUNNING. Each source subtask is its own pipelined region, so
    # region failover had nothing to cascade to; 407/408 tasks healthy is not a job
    # failure, so the restart strategy never fired and every checkpoint aborted with
    # "Not all required tasks are currently running" for 65 minutes. Changed here
    # too because failover policy is a fair-comparison variable: the two jobs must
    # recover identically or the Paimon-vs-Iceberg timings are not comparable.
    jobmanager.execution.failover-strategy: full
    # exponential-delay, not fixed-delay. fixed-delay's attempts counter is
    # GLOBAL, while failover-strategy: region files one restart request per
    # failed task — so a single TaskManager going away takes the whole graph's
    # budget with it. Observed exactly that: TM-1-4 shut down and the JM logged
    # "Restarting job." 200 times inside 20 MILLISECONDS, blew through
    # maxNumberRestartAttempts=100, and the job died with "Recovery is suppressed
    # by FixedDelayRestartBackoffTimeStrategy". No raise to that number is safe —
    # it scales with task count (264 here), not with how many real faults
    # happened. exponential-delay has no attempt cap, so one TM loss costs one
    # backoff instead of the entire budget, and repeated faults back off instead
    # of hot-looping. reset-backoff-threshold returns to the initial delay once
    # the job has been healthy for a while, which is what a long load test needs.
    restart-strategy.type: exponential-delay
    restart-strategy.exponential-delay.initial-backoff: "10s"
    restart-strategy.exponential-delay.max-backoff: "2min"
    restart-strategy.exponential-delay.backoff-multiplier: "2.0"
    restart-strategy.exponential-delay.reset-backoff-threshold: "10min"
    restart-strategy.exponential-delay.jitter-factor: "0.1"
    # graceful decommisioning
    cluster.taskmanager.graceful-decommission.enabled: "true"
    # Disabled: with combined-restart on, two vertices failing inside the same
    # window-interval produce "Ignore initial restart requests with ExecutionVertex
    # <id> not in failed state" and BOTH requests are dropped, so
    # restart-strategy.fixed-delay.attempts is never consumed. The job then sits
    # frozen while /jobs still reports RUNNING. Leave off for load tests.
    jobmanager.adaptive-scheduler.combined-restart.enabled: "false"
    # Scheduler
    # 'default', not 'adaptive' — kept in lockstep with the Paimon job. Adaptive
    # tracks desired vs available parallelism instead of requiring every declared
    # task to be deployed, which is how a subtask ended up FAILED with the job still
    # reporting RUNNING and failure-cause None. Autoscaling is off here
    # (job.autoscaler.*.enabled: "false"), so adaptive buys nothing. The default
    # scheduler declares the full task graph up front and fails loudly instead.
    jobmanager.scheduler: default
    taskmanager.numberOfTaskSlots: "4"
    # TaskManager heap. This job is where the OOM was observed: three
    # "OutOfMemoryError: Java heap space" hits inside the CDC deserializer
    # (RowDataDebeziumDeserializeSchema -> TemporalConversions.toLocalDateTime ->
    # Instant.parse), first on Source: mysql_src_customers (1/16) and then on Calc
    # and ConstraintEnforcer subtasks. Each one killed a TaskManager, which is what
    # produced the 62 "The TaskExecutor is shutting down" and 50 "Connection
    # unexpectedly closed by remote task manager" exceptions and left the job
    # running at 146/264 tasks with 12 failed checkpoints.
    #
    # Raising taskManager.resource.memory alone does NOT mostly go to heap. Flink
    # derives, from a 16Gi process size: metaspace 256Mi + jvm-overhead 1Gi off the
    # top, then managed = 0.4 x the remainder and network = 0.1 x the remainder, and
    # task heap is only what is left — 7.13Gi, shared by all 4 slots (~1.8Gi per
    # subtask). So 5.9Gi was sitting in managed memory, which is RocksDB's off-heap
    # block cache and write buffers, not heap the deserializer can use.
    #
    # Cutting the managed fraction to 0.2 keeps RocksDB at roughly its old absolute
    # allocation (6.1Gi at 32Gi process vs 5.9Gi at 16Gi) while redirecting the whole
    # size increase into task heap: ~21Gi, about 3x, or ~5.3Gi per slot.
    taskmanager.memory.managed.fraction: "0.2"
    # Parallelism
    parallelism.default: "4"
    pipeline.max-parallelism: "128"
    # Table Configuration
    table.exec.source.idle-timeout: "30s"
    # SQL Client Configuration
    sql-client.execution.result-mode: tableau
    table.dml-sync: "false"
    kubernetes.transactional-operation.max-retries: "10"

  jobManager:
    highAvailabilityEnabled: true
    storageDir: s3://${BUCKET_NAME}/flink/cdc-iceberg/ha
    replicas: 1
    resource:
      memory: 16Gi
      cpu: 4
    podTemplate:
      spec:
        nodeSelector:
          karpenter.sh/capacity-type: on-demand
          karpenter.sh/nodepool: ${JM_NODEPOOL}
        # flink-cdc-executor.py is mounted here from a ConfigMap built out of the
        # local file, NOT fetched from S3 — same operator artifact bug as the Paimon
        # job: the injected `aws-cli` initContainer downloads jarURI into volume
        # `flink-artifact` at /flink-artifact, which the main container never mounts
        # (it mounts `user-artifacts-volume` at /opt/flink/artifacts), while the job
        # args point at /opt/flink/usrlib/. The file is downloaded and discarded, and
        # PythonDriver fails with NoSuchFileException on its /tmp/pyflink temp copy.
        # Keep in lockstep with the Paimon job. Refresh the ConfigMap with:
        #   kubectl create configmap flink-cdc-executor-py -n emr-flink \
        #     --from-file=flink-cdc-executor.py=./flink-cdc-executor.py \
        #     --dry-run=client -o yaml | kubectl apply -f -
        volumes:
        - name: executor-py
          configMap:
            name: flink-cdc-executor-py
        containers:
        - name: flink-main-container
          volumeMounts:
          - name: executor-py
            mountPath: /opt/flink/usrlib
          # Password is never templated into this manifest — MYSQL_PASSWORD is
          # injected at pod start from Secret ${MYSQL_ENV_SECRET_NAME} (key
          # MYSQL_PASSWORD). envFrom is used rather than an env[].valueFrom
          # secretKeyRef because the EMR Flink operator's pod-template env merge
          # emits an empty `value: ""` next to `valueFrom`, which the Kubernetes
          # API rejects ("may not be specified when `value` is not empty").
          envFrom:
          - secretRef:
              name: ${MYSQL_ENV_SECRET_NAME}
          env:
          - name: MYSQL_HOST
            value: "${MYSQL_HOST}"
          - name: MYSQL_USER
            value: "${MYSQL_USER}"
          - name: ICEBERG_WAREHOUSE
            value: "s3://${BUCKET_NAME}/iceberg-warehouse/"
          - name: AWS_REGION
            value: "${AWS_REGION}"
          # Set for the v1 SDK's DefaultAwsRegionProviderChain, which reads
          # AWS_DEFAULT_REGION where the v2 SDK reads AWS_REGION. Kept in lockstep
          # with the Paimon job. Do NOT read it as a fix for the
          # "AWSGlueClientFactory - No region info found, using SDK default region:
          # us-east-1" -> EC2MetadataUtils -> "Unauthorized (Status Code: 401)"
          # sequence: that claim was tested and is false. Both AWS_REGION and
          # AWS_DEFAULT_REGION were confirmed present in the resolved container env
          # and the sequence still appeared, because the legacy EMR Glue client
          # takes its region from the Hadoop/Hive Configuration it is handed, not
          # from the process environment. See the longer note in
          # flink-cdc-paimon-sql.yaml — that job is where it was diagnosed.
          - name: AWS_DEFAULT_REGION
            value: "${AWS_REGION}"
          - name: GLUE_DATABASE
            value: "flink_iceberg_db"
          # Binlog client id ranges for the four mysql-cdc sources. These are
          # substituted into 02-cdc-sources.sql, which the JobManager parses, and
          # they must not overlap the Paimon job's 54xx ranges — both pipelines
          # read the same RDS instance, and MySQL evicts whichever binlog client
          # connected first when a second one reuses its id. See the server-id
          # note in sql-scripts/common/02-cdc-sources.sql.
          #
          # Each range is 32 wide to cover parallelism: 32 below — the connector
          # hands one id per source subtask, so a range narrower than the
          # parallelism makes subtasks share ids and evict each other.
          - name: CDC_SERVER_ID_CUSTOMERS
            value: "6401-6432"
          - name: CDC_SERVER_ID_PRODUCTS
            value: "6441-6472"
          - name: CDC_SERVER_ID_ORDERS
            value: "6481-6512"
          - name: CDC_SERVER_ID_ORDER_ITEMS
            value: "6521-6552"
  taskManager:
    resource:
      memory: 32Gi
      cpu: 8
    podTemplate:
      spec:
        containers:
        - name: flink-main-container
          env:
          - name: AWS_REGION
            value: "${AWS_REGION}"
          # The Hadoop/Hive Glue client reads AWS_DEFAULT_REGION, the v2 SDK
          # reads AWS_REGION. Set both so neither path falls back to us-east-1.
          - name: AWS_DEFAULT_REGION
            value: "${AWS_REGION}"
        # Same Karpenter consolidation exposure as the Paimon job: this nodepool
        # runs consolidationPolicy WhenEmptyOrUnderutilized / consolidateAfter 2m,
        # so nodes hosting RUNNING TaskManagers get evicted as "Underutilized",
        # and with failover-strategy: full one lost TM restarts all 520 tasks. The
        # fit table (8100m cpu / 32868Mi per TM -> 1/3/5/7 TMs on
        # 4x/8x/12x/16xlarge) and the fragmented-instance-mix feedback loop are
        # documented in full in flink-cdc-paimon-sql.yaml. Nodepool cpu limits are
        # not a factor. Keep in lockstep — TM placement is a fair-comparison knob.
        nodeSelector:
          karpenter.sh/capacity-type: on-demand
          karpenter.sh/nodepool: ${TM_NODEPOOL}

  job:
    jarURI: s3://${BUCKET_NAME}/flink/scripts/flink-cdc-executor.py
    entryClass: org.apache.flink.client.python.PythonDriver
    args:
      - "-py"
      - "/opt/flink/usrlib/flink-cdc-executor.py"
      - "--sql-dir"
      - "s3://${BUCKET_NAME}/flink/sql-scripts/iceberg/"
      - "--checkpoint-interval"
      - "60s"
      - "--parallelism"
      - "32"
    parallelism: 32
    upgradeMode: last-state

  monitoringConfiguration:
    s3MonitoringConfiguration:
      logUri: s3://${BUCKET_NAME}/flink/logs/cdc-iceberg
    sideCarResources:
      limits:
        cpuLimit: 500m
        memoryLimit: 250Mi
    containerLogRotationConfiguration:
        rotationSize: 2GB
        maxFilesToKeep: "10"
        