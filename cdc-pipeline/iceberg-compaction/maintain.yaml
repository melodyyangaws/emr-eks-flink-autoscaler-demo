# Continuous Iceberg maintenance for the CDC tables (maintain.py), as ONE
# long-running FlinkDeployment -- same family as the writers (flink-cdc-iceberg),
# controlled the same way: suspend/resume via spec.job.state, upgradeMode
# last-state. Rendered by run-maintain.sh into maintain-deployed.yaml
# (git-ignored: bucket, account ID, role).
#
# One small .py staged to S3 (jarURI + PythonDriver, the pattern
# throughput-benchmark/compaction/flink-cid-compact.yaml uses), not a jar to
# build. It runs on the writers' own image, so its Iceberg version always
# matches theirs.
#
# Parallelism 1: the graph is driven by trigger events (one per table commit).
# TaskManager heap is the limit, not cpu: a Rewrite task loads the table's whole
# equality-delete set (TM_MEMORY 32Gi; 8Gi OOMed at ~35M deletes). See
# maintain.py's module docstring for why this runs every --schedule-commits commits.
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  namespace: ${NAMESPACE}
  name: ${NAME}
spec:
  flinkVersion: v1_20
  executionRoleArn: ${EMR_EXECUTION_ROLE_ARN}
  image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/emr-flink-cdc-paimon:${IMAGE_TAG}
  imagePullPolicy: IfNotPresent
  emrReleaseLabel: "emr-${EMR_VERSION}-flink-latest"

  flinkConfiguration:
    aws.region: ${AWS_REGION}
    fs.s3a.endpoint.region: ${AWS_REGION}
    job.autoscaler.enabled: "false"
    pipeline.operator-chaining.enabled: "true"
    restart-strategy.type: exponential-delay
    restart-strategy.exponential-delay.initial-backoff: "10s"
    restart-strategy.exponential-delay.max-backoff: "2min"
    taskmanager.numberOfTaskSlots: "${TM_SLOTS}"
    # last-state needs a checkpoint dir (operator webhook); per table set, like the writers.
    execution.checkpointing.interval: "60s"
    execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
    state.backend.type: hashmap
    state.checkpoints.dir: s3p://${BUCKET_NAME}/flink/${NAME}${CDC_DB_SUFFIX}/checkpoints/
    state.savepoints.dir: s3p://${BUCKET_NAME}/flink/${NAME}${CDC_DB_SUFFIX}/savepoints/

  jobManager:
    highAvailabilityEnabled: true
    storageDir: s3://${BUCKET_NAME}/flink/${NAME}${CDC_DB_SUFFIX}/ha/
    replicas: 1
    resource:
      memory: ${JM_MEMORY}
      cpu: ${JM_CPU}
    podTemplate:
      spec:
        nodeSelector:
          karpenter.sh/capacity-type: on-demand
          karpenter.sh/nodepool: ${JM_NODEPOOL}
        containers:
        - name: flink-main-container
          env:
          - name: AWS_REGION
            value: "${AWS_REGION}"
          - name: AWS_DEFAULT_REGION
            value: "${AWS_REGION}"
  taskManager:
    resource:
      memory: ${TM_MEMORY}
      cpu: ${TM_CPU}
    podTemplate:
      metadata:
        annotations:
          karpenter.sh/do-not-disrupt: "true"
      spec:
        nodeSelector:
          karpenter.sh/capacity-type: on-demand
          karpenter.sh/nodepool: ${TM_NODEPOOL}
        containers:
        - name: flink-main-container
          env:
          - name: AWS_REGION
            value: "${AWS_REGION}"
          - name: AWS_DEFAULT_REGION
            value: "${AWS_REGION}"

  job:
    jarURI: s3://${BUCKET_NAME}/flink/scripts/iceberg-maintain.py
    entryClass: org.apache.flink.client.python.PythonDriver
    args:
      - "-py"
      - "/opt/flink/usrlib/iceberg-maintain.py"
      - "maintain"
      - "--db"
      - "${ICEBERG_DB}"
      - "--warehouse"
      - "s3://${BUCKET_NAME}/iceberg-warehouse"
      - "--region"
      - "${AWS_REGION}"
      - "--tables"
      - "${MAINT_TABLES}"
      - "--schedule-commits"
      - "${SCHEDULE_COMMITS}"
      - "--partial-progress-max-commits"
      - "${PARTIAL_PROGRESS_MAX_COMMITS}"
      - "--expire-hours"
      - "${EXPIRE_HOURS}"
      - "--expire-retain-last"
      - "${EXPIRE_RETAIN_LAST}"
      - "--job-name"
      - "${NAME}"
    parallelism: 1
    upgradeMode: last-state
    state: ${JOB_STATE}

  monitoringConfiguration:
    s3MonitoringConfiguration:
      logUri: s3://${BUCKET_NAME}/flink/logs/${NAME}
    sideCarResources:
      limits:
        cpuLimit: 500m
        memoryLimit: 250Mi
