apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  namespace: emr-flink
  name: flink-cdc-paimon
spec:
  flinkVersion: v1_20
  executionRoleArn: ${EMR_EXECUTION_ROLE_ARN}
  image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/emr-flink-cdc-paimon:${IMAGE_TAG}
  # Always: the tag (7.14.0) is rebuilt in place, so a node could otherwise run
  # a stale copy. Layers already on the node are not re-downloaded.
  imagePullPolicy: Always
  emrReleaseLabel: "emr-${EMR_VERSION}-flink-latest"

  flinkConfiguration:
    # Paimon only: EMR's Glue integration provides /glue/confs/{hive,hadoop}/conf
    # for paimon_catalog's 'metastore' = 'hive' (sql-scripts/paimon/01-catalog-
    # setup.sql). The Iceberg job talks to Glue through Iceberg's own GlueCatalog
    # and does not set it — the one intended flinkConfiguration difference.
    aws.glue.enabled: "true"
    # Region from the AWS_REGION placeholder, never hardcoded: the Paimon
    # manifest used to pin us-west-2 here while the Iceberg one was templated.
    aws.region: ${AWS_REGION}
    # S3 Configuration
    fs.s3a.endpoint.region: ${AWS_REGION}
    # Autoscaler off
    job.autoscaler.scaling.enabled: "false"
    job.autoscaler.enabled: "false"
    # ON (it was "false"), with object reuse, as in the throughput-benchmark
    # writers. Off, every row was serialized and copied across each Source ->
    # DropUpdateBefore -> Calc -> ConstraintEnforcer edge; object-reuse-off
    # copies alone were 27% of task CPU in the throughput profile (2026-10-09).
    # The UI and REST then show one vertex per chain, so per-operator record
    # counts come from operator-scoped metrics (monitoring/flink_cdc_monitor.py).
    # Fair-comparison variables: keep identical across both formats.
    # OFF since 2026-11-06 (both jobs): on _readonlytest the Paimon job read the
    # binlog catch-up ~2x slower than Iceberg with idle writers and no
    # backpressure, pointing at the single binlog source subtask doing the
    # chained per-row conversion (Calc -> ConstraintEnforcer -> Map to BinaryRow).
    # Unchained, the source vertex is the reader alone, so its busyTimeMsPerSecond
    # (job monitor: busiest source) isolates the reader; the cost is a serialized
    # hop per edge (see above).
    pipeline.operator-chaining.enabled: "false"
    pipeline.object-reuse: "true"
    pipeline.auto-watermark-interval: "1s"
    execution.checkpointing.interval: "60s"
    execution.checkpointing.timeout: "600s"
    execution.checkpointing.min-pause: "30s"
    # Survive transient checkpoint failures during the initial snapshot instead of
    # failing the job. The snapshot phase reads 491M rows / 102 GiB from RDS, and a
    # checkpoint taken mid-snapshot has to persist large per-split backfill state; a
    # single timeout there is normal and is not a reason to restart 408 tasks. The
    # default is 0, meaning the very first failed checkpoint kills the job. Interval
    # itself stays at 60s — it is a fair-comparison variable and must match Iceberg.
    execution.checkpointing.tolerable-failed-checkpoints: "10"
    execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
    # hashmap, not RocksDB + changelog + EBS local recovery (2026-11-02). The
    # graph has no keyed operator: its state is the CDC sources' split
    # assignments and the writers' pending commits, small enough for the heap.
    # This drops the per-record changelog uploads to S3 and the per-TM EBS
    # volumes local recovery created (40 orphaned PVCs were found 2026-09-27).
    # Watch heap during the initial snapshot, when the sources hold the most
    # split state. Fair-comparison variable: keep identical across both formats.
    state.backend.type: hashmap
    # increase from default 50s to 3min to tolerate GC pauses during heavy commits
    heartbeat.timeout: "180s"
    heartbeat.interval: "20s"
    heartbeat.rpc-failure-threshold: "10"
    # Every state path carries the SESSION_SUFFIX placeholder (_v3 by default),
    # as do the Glue database names below, so each table set (the v3 default,
    # or the unsuffixed v2 set) starts from its own state and never restores a
    # checkpoint, savepoint or HA pointer written against the other's tables.
    state.checkpoints.dir: s3p://${BUCKET_NAME}/flink/cdc-paimon${SESSION_SUFFIX}/checkpoints/
    state.savepoints.dir: s3p://${BUCKET_NAME}/flink/cdc-paimon${SESSION_SUFFIX}/savepoints/
    # Restart Strategy
    # 'full', not 'region'. region restarts only the failed pipelined region, and
    # on this graph each of the 16 source subtasks is its own region — so when
    # Source: mysql_src_customers[1] subtask 0 died, region failover had nothing
    # to cascade to and the other 15 subtasks were left RUNNING. 407 of 408 tasks
    # healthy is not a job failure to Flink, so the restart strategy below never
    # fired and the orphan was never replaced. Every subsequent checkpoint then
    # aborted at trigger time:
    #   "Checkpoint triggering task Source: mysql_src_customers[1] (1/16) ... is not
    #    being executed at the moment. Aborting checkpoint. Failure reason: Not all
    #    required tasks are currently running."
    # Aborted-at-trigger checkpoints are not counted as FAILED, so
    # tolerable-failed-checkpoints: "10" never fired either. Net effect: 0
    # checkpoints committed in 65 minutes, job pinned at RUNNING, no error surfaced.
    # Reproduced twice on independent from-scratch deployments (subtask 0 both
    # times, attempt 1 then attempt 0, failure-cause None in both). 'full' makes a
    # single lost source subtask restart the whole graph, which for a CDC job that
    # cannot checkpoint without all 16 sources is the only correct behaviour.
    jobmanager.execution.failover-strategy: full
    # exponential-delay, not fixed-delay. fixed-delay's attempts counter is
    # GLOBAL, while failover-strategy: region files one restart request per
    # failed task — so a single TaskManager going away takes the whole graph's
    # budget with it. Observed exactly that on the Iceberg job: one TM shut down
    # and the JM logged "Restarting job." 200 times inside 20 MILLISECONDS, blew
    # through maxNumberRestartAttempts=100, and the job died with "Recovery is
    # suppressed by FixedDelayRestartBackoffTimeStrategy". No raise to that number
    # is safe — it scales with task count (408 here), not with how many real
    # faults happened. exponential-delay has no attempt cap, so one TM loss costs
    # one backoff instead of the entire budget, and repeated faults back off
    # instead of hot-looping. reset-backoff-threshold returns to the initial delay
    # once the job has been healthy for a while, which a long load test needs.
    restart-strategy.type: exponential-delay
    restart-strategy.exponential-delay.initial-backoff: "10s"
    restart-strategy.exponential-delay.max-backoff: "2min"
    restart-strategy.exponential-delay.backoff-multiplier: "2.0"
    restart-strategy.exponential-delay.reset-backoff-threshold: "10min"
    restart-strategy.exponential-delay.jitter-factor: "0.1"
    # graceful decommisioning
    cluster.taskmanager.graceful-decommission.enabled: "true"
    # Disabled: with combined-restart on, two vertices failing inside the same
    # window-interval produce "Ignore initial restart requests with ExecutionVertex
    # <id> not in failed state" and BOTH requests are dropped, so
    # restart-strategy.fixed-delay.attempts is never consumed. The job then sits
    # frozen while /jobs still reports RUNNING. Leave off for load tests.
    jobmanager.adaptive-scheduler.combined-restart.enabled: "false"
    jobmanager.adaptive-scheduler.resource-wait-timeout: "10m"
    # Scheduler
    # 'default', not 'adaptive'. The adaptive scheduler is what allowed a subtask to
    # sit in FAILED while its siblings stayed RUNNING and the job stayed RUNNING: it
    # tracks desired vs available parallelism rather than requiring every declared
    # task to be deployed, and it logged no "switched to FAILED" transition for the
    # orphan at all (failure-cause came back None from /jobs). Autoscaling is off
    # here anyway (job.autoscaler.*.enabled: "false"), so adaptive buys nothing and
    # costs the all-tasks-running invariant that checkpointing depends on. The
    # default scheduler declares the full 408-task graph up front and fails the job
    # if it cannot keep it deployed — which is what we want to see, loudly, instead
    # of a silent stall. Keep in sync with Iceberg: this is a fair-comparison knob.
    jobmanager.scheduler: default
    # 2, not 4 (2026-11-04): at 4 slots the Paimon writer heap-OOMed every ~2 min in
    # the initial snapshot (a TaskManager at 23 of 26 GB heap). Same for both jobs.
    taskmanager.numberOfTaskSlots: "2"
    # TaskManager heap. The CDC deserializer OOMed at the previous sizing
    # ("OutOfMemoryError: Java heap space" inside RowDataDebeziumDeserializeSchema
    # -> TemporalConversions.toLocalDateTime -> Instant.parse), which took the TM
    # down and cascaded into "The TaskExecutor is shutting down" and
    # "Connection unexpectedly closed by remote task manager" on every peer.
    #
    # Raising taskManager.resource.memory alone does NOT mostly go to heap. Flink
    # derives, from a 16Gi process size: metaspace 256Mi + jvm-overhead 1Gi off the
    # top, then managed = 0.4 x the remainder and network = 0.1 x the remainder, and
    # task heap is only what is left — 7.13Gi, shared by all 4 slots (~1.8Gi per
    # subtask). So 5.9Gi was sitting in managed memory, which is RocksDB's off-heap
    # block cache and write buffers, not heap the deserializer can use.
    #
    # Cutting the managed fraction to 0.2 keeps RocksDB at roughly its old absolute
    # allocation (6.1Gi at 32Gi process vs 5.9Gi at 16Gi) while redirecting the whole
    # size increase into task heap: ~21Gi, about 3x, or ~5.3Gi per slot.
    # 0.1, not 0.2 (2026-11-02): managed memory was RocksDB's, and the state
    # backend is now hashmap, so it only moves ~3Gi more into task heap.
    taskmanager.memory.managed.fraction: "0.1"
    # JobManager metaspace: 512m, not Flink's 256m default. The Paimon JM died with
    # "OutOfMemoryError: Metaspace" (exit 239) after ~20 min on 2026-11-03 (_v3r3):
    # its Glue/Hive metastore client and the Iceberg-export commit path load classes
    # per commit. Kept identical in both manifests (fair-comparison variable).
    jobmanager.memory.jvm-metaspace.size: "512m"
    # Parallelism
    parallelism.default: "4"
    pipeline.max-parallelism: "128"
    # Table Configuration
    table.exec.source.idle-timeout: "30s"
    # SQL Client Configuration
    sql-client.execution.result-mode: tableau
    table.dml-sync: "false"
    kubernetes.transactional-operation.max-retries: "10"

  jobManager:
    highAvailabilityEnabled: true
    storageDir: s3://${BUCKET_NAME}/flink/cdc-paimon${SESSION_SUFFIX}/ha/
    replicas: 1
    resource:
      memory: 8Gi
      cpu: 4
    podTemplate:
      spec:
        nodeSelector:
          karpenter.sh/capacity-type: on-demand
          karpenter.sh/nodepool: ${JM_NODEPOOL}
        containers:
        - name: flink-main-container
          envFrom:
          - secretRef:
              name: ${MYSQL_ENV_SECRET_NAME}
          # MYSQL_HOST, MYSQL_USER and MYSQL_PASSWORD come from the Secret above
          # (envFrom: every key is an env var); do not repeat them in env, where a
          # rendered value would silently win over the Secret.
          env:
          - name: MYSQL_PORT
            value: "${MYSQL_PORT}"
          - name: MYSQL_DATABASE
            value: "${MYSQL_DATABASE}"
          - name: PAIMON_WAREHOUSE
            value: "s3://${BUCKET_NAME}/paimon-warehouse/"
          - name: AWS_REGION
            value: "${AWS_REGION}"
          # Set for the v1 SDK's DefaultAwsRegionProviderChain, which reads
          # AWS_DEFAULT_REGION where the v2 SDK reads AWS_REGION. Harmless and
          # worth keeping, but do NOT read it as a fix for this log sequence:
          #   AWSGlueClientFactory - No region info found, using SDK default
          #     region: us-east-1
          #   EC2MetadataUtils - Unable to retrieve the requested metadata
          #     (/latest/dynamic/instance-identity/document)
          #   com.amazonaws.AmazonServiceException: Unauthorized (Status Code: 401)
          # That claim was tested and is false. With BOTH AWS_REGION and
          # AWS_DEFAULT_REGION confirmed present in the resolved JM and TM
          # container env (verified with `env | grep ^AWS_`), the sequence still
          # appeared. The legacy EMR Glue client resolves its region from the
          # Hadoop/Hive Configuration it is handed, not from the process
          # environment, so no env var can suppress it. The 401 is IMDSv2 being
          # unreachable from the pod (hop limit / IRSA-only networking).
          #
          # It is also NOT a failure. The job reaches RUNNING 808/808 with these
          # lines present, and they do not appear in steady-state TM logs at all
          # (0 hits across all 8 TMs). Treat this as noise and look elsewhere for
          # a restart cause — see the note on Karpenter consolidation in the
          # taskManager nodeSelector below, which is what actually restarts this
          # job. To silence it properly you would set the region in Hadoop conf
          # (e.g. a hive-site/core-site property the Glue factory reads), not here.
          - name: AWS_DEFAULT_REGION
            value: "${AWS_REGION}"
          # SESSION_SUFFIX keeps a v3 (or any other) run in its own database:
          # an existing table cannot change format version.
          - name: GLUE_DATABASE
            value: "flink_paimon_db${SESSION_SUFFIX}"
          # Write path (INSERT hints) and S3A upload shape (catalog options);
          # set in build-deploy-generic.sh check_env_vars.
          - name: PAIMON_WRITE_ONLY
            value: "${PAIMON_WRITE_ONLY}"
          - name: PAIMON_WRITE_BUFFER_SPILLABLE
            value: "${PAIMON_WRITE_BUFFER_SPILLABLE}"
          - name: PAIMON_WRITE_BUFFER_SIZE_DIM
            value: "${PAIMON_WRITE_BUFFER_SIZE_DIM}"
          - name: PAIMON_WRITE_BUFFER_SIZE_FACT
            value: "${PAIMON_WRITE_BUFFER_SIZE_FACT}"
          - name: S3A_MULTIPART_SIZE
            value: "${S3A_MULTIPART_SIZE}"
          - name: S3A_MULTIPART_THRESHOLD
            value: "${S3A_MULTIPART_THRESHOLD}"
          - name: S3A_ACTIVE_BLOCKS
            value: "${S3A_ACTIVE_BLOCKS}"
          # Table-format knobs, rendered by build-deploy-generic.sh and
          # substituted into the sink DDL by the executor. All are set on both
          # JobManagers so the manifests stay in lockstep; each SQL reads only
          # the ones it needs. ICEBERG_FORMAT_VERSION and PAIMON_DV_BITMAP64
          # must never render empty: the executor treats "" as set, and an
          # empty value becomes = '' in CREATE TABLE.
          #  - ICEBERG_FORMAT_VERSION (2|3): Iceberg sink format-version, and
          #    Paimon's metadata.iceberg.format-version.
          #  - PAIMON_DV_BITMAP64 (true|false): derived from the format version
          #    (true iff 3); StarRocks' native Paimon reader cannot decode
          #    64-bit deletion vectors, so a v2 run gets false.
          - name: ICEBERG_FORMAT_VERSION
            value: "${ICEBERG_FORMAT_VERSION}"
          - name: PAIMON_DV_BITMAP64
            value: "${PAIMON_DV_BITMAP64}"
          # Binlog client id ranges for the four mysql-cdc sources. These are
          # substituted into 02-cdc-sources.sql, which the JobManager parses, and
          # they must not overlap the Iceberg job's 64xx ranges — both pipelines
          # read the same RDS instance, and MySQL evicts whichever binlog client
          # connected first when a second one reuses its id. See the server-id
          # note in sql-scripts/common/02-cdc-sources.sql.
          #
          # Each range is 32 wide, covering the job parallelism below with room to raise it — the connector
          # hands one id per source subtask, so a range narrower than the
          # parallelism makes subtasks share ids and evict each other.
          - name: CDC_SERVER_ID_CUSTOMERS
            value: "5401-5432"
          - name: CDC_SERVER_ID_PRODUCTS
            value: "5441-5472"
          - name: CDC_SERVER_ID_ORDERS
            value: "5481-5512"
          - name: CDC_SERVER_ID_ORDER_ITEMS
            value: "5521-5552"
  taskManager:
    resource:
      memory: 32Gi
      cpu: 8
    podTemplate:
      metadata:
        annotations:
          # Karpenter must not consolidate a node away from under a TaskManager:
          # with failover-strategy full each evicted TM restarts the whole job
          # (see the Karpenter row in README.md's troubleshooting table). The
          # fix belongs on the pods, not the shared nodepool. Same as the
          # throughput-benchmark writers.
          karpenter.sh/do-not-disrupt: "true"
      spec:
        containers:
        - name: flink-main-container
          env:
          - name: AWS_REGION
            value: "${AWS_REGION}"
          # The Hadoop/Hive Glue client reads AWS_DEFAULT_REGION, the v2 SDK
          # reads AWS_REGION. Set both so neither path falls back to us-east-1.
          - name: AWS_DEFAULT_REGION
            value: "${AWS_REGION}"
        nodeSelector:
          karpenter.sh/capacity-type: on-demand
          karpenter.sh/nodepool: ${TM_NODEPOOL}
  job:
    jarURI: s3://${BUCKET_NAME}/flink/scripts/flink-cdc-executor.py
    entryClass: org.apache.flink.client.python.PythonDriver
    args:
      - "-py"
      - "/opt/flink/usrlib/flink-cdc-executor.py"
      - "--sql-dir"
      - "s3://${BUCKET_NAME}/flink/sql-scripts/paimon/"
      - "--checkpoint-interval"
      - "60s"
      - "--parallelism"
      - "12"
    # 12 (32 until 2026-11-04, then 16, then 24 until 2026-11-05): 6 TaskManagers x 2 slots. Keep both jobs equal.
    parallelism: 12
    upgradeMode: last-state

  monitoringConfiguration:
    s3MonitoringConfiguration:
      logUri: s3://${BUCKET_NAME}/flink/logs/cdc-paimon${SESSION_SUFFIX}
    sideCarResources:
      limits:
        cpuLimit: 500m
        memoryLimit: 250Mi
    containerLogRotationConfiguration:
        rotationSize: 2GB
        maxFilesToKeep: "10"
