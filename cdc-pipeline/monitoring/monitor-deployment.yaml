# Flink CDC monitor — runs on stock python:3.11-slim, no custom image.
#
# There is deliberately no image to build. The monitor is two Python files
# (~41 KB, well under the 1 MB ConfigMap limit), so mounting them from a
# ConfigMap and pip-installing requirements.txt at boot costs ~40s of pod
# startup and removes the whole build-and-push path: no Dockerfile, no ECR
# repository, no ECR push IAM grant, and no 10-minute pip dependency
# resolution inside a builder pod on every code change.
#
# deploy-monitor.sh renders the ${VAR} placeholders below, (re)creates the
# flink-cdc-monitor-code ConfigMap from the real .py files, and applies this.
apiVersion: v1
kind: ConfigMap
metadata:
  name: flink-cdc-monitor-config
  namespace: ${NAMESPACE}
data:
  PAIMON_FLINK_URL: "http://flink-cdc-paimon-rest:8081"
  ICEBERG_FLINK_URL: "http://flink-cdc-iceberg-rest:8081"
  AWS_REGION: "${AWS_REGION}"
  # SESSION_SUFFIX (cdc-pipeline/.bench-env; empty, or e.g. _v3 for the Iceberg
  # v3 table set): the Glue databases the Flink jobs write, and so the Paimon
  # warehouse path <db>.db/ the monitor scans.
  PAIMON_GLUE_DB: "flink_paimon_db${SESSION_SUFFIX}"
  ICEBERG_GLUE_DB: "flink_iceberg_db${SESSION_SUFFIX}"
  # Paimon native warehouse root — S3 scan reads <db>.db/<table>/snapshot/ and bucket-N/
  PAIMON_WAREHOUSE: "s3://${BUCKET_NAME}/paimon-warehouse"
  ICEBERG_WAREHOUSE: "s3://${BUCKET_NAME}/iceberg-warehouse/"
  CDC_TABLES: "customers,products,orders,order_items"
  # Sampling window per pipeline, reported as "Duration (s)" in the comparison
  # table. Headline throughput is rows committed / time between commits, from
  # the tables' history, so the window must span at least one 60s checkpoint;
  # keep it a multiple of POLL_INTERVAL for the counter and rate-meter fallbacks.
  MONITOR_DURATION: "120"
  POLL_INTERVAL: "20"
  # Pause between cycles. The two pipelines are sampled in parallel, so a
  # cycle is MONITOR_DURATION plus the table reads (~1 min): 15 s gives about
  # 10 reports per format per 30 min, the hot test's ingest window.
  REPEAT_INTERVAL: "15"
  RUN_MODE: "continuous"
  # Every report JSON is also copied here (best-effort; a failed upload is
  # logged and the report stays in /tmp/reports). /tmp/reports is an emptyDir
  # and the query benchmark's teardown scales this Deployment to 0, so without
  # the copy the reports are lost. querybench/run.sh summary reads them back by
  # time window. The IRSA role behind starrocks-sa may write the bucket
  # (iam simulate-principal-policy s3:PutObject: allowed). Empty = local only.
  REPORT_S3_URI: "s3://${BUCKET_NAME}/querybench-results/cdc-session${CDC_SET_TAG}/monitor/"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-cdc-monitor
  namespace: ${NAMESPACE}
  labels:
    app: flink-cdc-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flink-cdc-monitor
  template:
    metadata:
      labels:
        app: flink-cdc-monitor
    spec:
      # Needs an IRSA-annotated SA: the monitor reads Glue table metadata and
      # lists the warehouse prefixes in S3.
      serviceAccountName: ${MONITOR_SERVICE_ACCOUNT}
      containers:
      - name: monitor
        image: python:3.11-slim
        command: ["/bin/sh", "-c"]
        # /code is a read-only ConfigMap mount, so copy to a writable dir first —
        # pyiceberg writes bytecode caches next to the source.
        args:
        - |
          set -e
          cp /code/*.py /code/requirements.txt /app/
          cd /app
          pip install --no-cache-dir --quiet -r requirements.txt
          # Unbuffered, or the report output only appears when the pod dies.
          exec python -u entrypoint.py
        envFrom:
        - configMapRef:
            name: flink-cdc-monitor-config
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 2Gi
        volumeMounts:
        - name: code
          mountPath: /code
        - name: app
          mountPath: /app
        - name: reports
          mountPath: /tmp/reports
      volumes:
      - name: code
        configMap:
          name: flink-cdc-monitor-code
      - name: app
        emptyDir: {}
      - name: reports
        emptyDir:
          sizeLimit: 500Mi
      restartPolicy: Always
