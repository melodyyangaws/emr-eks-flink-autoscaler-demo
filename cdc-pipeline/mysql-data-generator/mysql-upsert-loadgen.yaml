---
# ~69,000 rows/sec UPSERT load generator for the Paimon-vs-Iceberg CDC benchmark.
# That figure is the measured ceiling of the RDS instance under test
# (db.m5.2xlarge, 500GB gp3, 12,000 IOPS), not a chosen target — see the
# replicas: comment on the StatefulSet for the sweep that established it.
#
# Why it replaced mysql-data-generator.yaml
# -----------------------------------------
# The original row-at-a-time INSERT/UPDATE/DELETE generator (Deployment
# mysql-data-generator, removed 2026-11-02; in git history) tops out around
# 400 rows/sec. Two reasons, both fatal at
# 40k:
#   1. It issues one cursor.execute() per order AND one per order item, so a
#      "batch" of 10 orders is ~40 round trips. At ~1ms RTT to RDS that alone
#      caps it in the hundreds per second.
#   2. Every operation starts with `ORDER BY RAND() LIMIT n` to pick rows. On
#      tables of 2.4M-14M rows that is a full scan plus a sort per call — it gets
#      slower as the benchmark runs, which is the opposite of what a load test
#      needs.
# Measured ceiling of the old generator on this dataset: ~777 rows / 2s.
#
# This generator instead:
#   - builds ONE multi-row `INSERT ... ON DUPLICATE KEY UPDATE` per batch, so
#     BATCH_ROWS row-modifications cost one round trip,
#   - picks primary keys arithmetically from a known id range (sampled once at
#     startup) instead of with ORDER BY RAND(), so cost per row is flat over time,
#   - rate-limits with a token bucket to hit a requested rows/sec rather than
#     running flat out, so the reported number is a target that was met rather
#     than whatever the box happened to do.
#
# Why ON DUPLICATE KEY UPDATE and not UPDATE
# ------------------------------------------
# This is the upsert test case. A multi-row ON DUPLICATE KEY UPDATE lets a single
# statement mix genuine inserts and genuine updates, which is what an upsert
# stream actually is, and MySQL emits the corresponding per-row binlog events
# either way — so Debezium/Flink CDC sees +I for new keys and -U/+U for existing
# ones. A plain multi-row UPDATE cannot express per-row new values without one
# statement per row, which is the round-trip problem above.
#
# Why the key distribution is skewed (HOT_KEY_RATIO)
# --------------------------------------------------
# This is the whole point of the comparison. Repeatedly upserting the SAME small
# set of keys is what separates the two formats:
#   - Iceberg merge-on-read writes an equality-delete file per commit per key
#     touched; re-touching hot keys accumulates delete files that every
#     subsequent read must apply (the monitor already shows total-delete-files
#     climbing with total-equality-deletes == total-records).
#   - Paimon's LSM compacts those same repeated keys away in the background.
# A uniformly-random key stream would spread writes so thinly across 14M keys
# that neither effect shows up, and the benchmark would measure raw ingest only.
# So HOT_KEY_RATIO of the upserts land in a sliding window of the most recent
# HOT_KEY_WINDOW keys, and the rest spread over the live range [MIN(pk), MAX(pk)]
# (not [1, MAX]: after the tables are shrunk to their newest ~10% of ids, a cold
# draw below MIN would INSERT at a deleted id and regrow the table).
#
# The skew is also the single biggest throughput lever, for a reason unrelated to
# the format comparison: the non-hot remainder is uniform over ~100GB and misses
# the buffer pool, so each cold upsert costs a random read. At ratio 0.6 that read
# traffic consumed 43% of the instance's provisioned IOPS and capped the whole
# generator at ~15,000 rows/s. At 0.95 with a 2,000,000-key window it runs at
# ~58,300 rows/s. See the env-var comments on HOT_KEY_RATIO for the measurements.
#
# Why a share of rows re-write a key written seconds ago (RECENT_KEY_RATIO)
# -------------------------------------------------------------------------
# The Iceberg sink runs in upsert mode with write.distribution-mode=hash, so a
# key always reaches the same writer subtask, and that writer emits a delete for
# EVERY row it writes, inserts included (orders, measured: total-equality-deletes
# 28.3M ~= total-records 28.8M). Which KIND of delete depends only on whether the
# writer already wrote that key in the CURRENT, not-yet-committed checkpoint:
# Iceberg's BaseEqualityDeltaWriter keeps an in-memory map of the rows it
# inserted since the last commit; a key found there gets a POSITION delete (a
# deletion vector on v3), any other key an EQUALITY delete. The map resets at
# every checkpoint (60s here). The hot window repeats keys within minutes-to-
# hours, not within one checkpoint, so only ~2% of deletes were positional
# (total-position-deletes 0.5M against 28.3M equality).
#
# RECENT_KEY_RATIO makes about half of the deletes positional, which is the
# v3 deletion-vector path the benchmark otherwise barely exercises: that share
# of every batch re-writes keys this same worker thread wrote within the last
# RECENT_KEY_MAX_AGE_S seconds, so most of them land in the same checkpoint as
# their previous write. Paimon gets the identical stream and simply dedups the
# repeats in its write buffer — that asymmetry is intended. See the env-var
# comments for the derivation of the defaults.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-upsert-loadgen-script
  namespace: emr-flink
data:
  upsert_loadgen.py: |
    #!/usr/bin/env python3
    """High-throughput MySQL upsert generator for CDC load testing."""
    import bisect
    import os
    import random
    import string
    import sys
    import threading
    import time
    from datetime import datetime

    import mysql.connector

    DB = {
        'host': os.environ['MYSQL_HOST'],
        'user': os.environ['MYSQL_USER'],
        'password': os.environ['MYSQL_PASSWORD'],
        'database': os.environ.get('MYSQL_DATABASE', 'ecommerce'),
        'autocommit': True,
        # A large multi-row INSERT is one big packet; the default 32MB client
        # limit is fine but be explicit so a BATCH_ROWS bump cannot silently
        # start failing with "packet too large".
        'connection_timeout': 30,
        # Use the C extension (_mysql_connector) rather than the pure-Python
        # protocol implementation. Building and serializing a 2,000-row statement
        # is where a generator pod actually spends its CPU, and in pure Python
        # that work holds the GIL — which is what capped a pod at ~5,000 rows/s
        # no matter how many threads it ran. The C path releases the GIL during
        # socket I/O and escapes parameters natively.
        #
        # USE_PURE=true falls back to pure Python: the C extension is a compiled
        # wheel, so if the image's platform ever lacks one, pip installs only the
        # pure-Python part and use_pure=False would raise at connect() time.
        'use_pure': os.environ.get('USE_PURE', 'false').lower() == 'true',
    }

    RATE          = int(os.environ.get('RATE_PER_POD', '5000'))    # rows/sec, this pod
    THREADS       = int(os.environ.get('THREADS', '4'))
    BATCH_ROWS    = int(os.environ.get('BATCH_ROWS', '500'))
    # Applies to the NON-recent share only (1 - RECENT_KEY_RATIO of each batch):
    # of those rows, UPSERT_RATIO update an existing key drawn by pick_key()
    # (hot window / cold tail) and the rest are new AUTO_INCREMENT inserts. So
    # the stream-wide insert share is (1 - RECENT_KEY_RATIO) x (1 - UPSERT_RATIO).
    UPSERT_RATIO  = float(os.environ.get('UPSERT_RATIO', '0.8'))
    # Defaults track the StatefulSet's env values so a run launched without them
    # does not silently fall back to the IOPS-bound 0.6 / 50,000 combination.
    HOT_KEY_RATIO = float(os.environ.get('HOT_KEY_RATIO', '0.95'))
    HOT_WINDOW    = int(os.environ.get('HOT_KEY_WINDOW', '2000000'))
    REPORT_EVERY  = int(os.environ.get('REPORT_SECONDS', '15'))
    DURATION      = int(os.environ.get('DURATION_SECONDS', '0'))   # 0 = run forever

    # ── Hot-window sharding ─────────────────────────────────────────────────
    # Every pod used to draw hot keys from the SAME HOT_KEY_WINDOW, so each added
    # pod piled onto the same rows. Measured at 40 replicas: 154 of 163 server
    # connections sat in LOCK WAIT, 2.33M cumulative row-lock waits averaging
    # 135ms, while RDS CPU idled at 46% and write IOPS sat at 8,000 of 12,000
    # provisioned. Aggregate throughput peaked at ~69,000 rows/s on 32 replicas
    # and then FELL to 66,000 at 40 — a lock convoy, not a hardware limit.
    #
    # Giving each pod a disjoint slice removes the cross-pod collisions without
    # weakening the benchmark. The Iceberg-vs-Paimon comparison needs the same
    # keys rewritten over and over (that is what makes Iceberg pile up equality
    # -delete files while Paimon's LSM compacts them). Sharding makes each key
    # HOTTER, not colder: with 32 pods a pod cycles ~1,560 keys instead of
    # 50,000, so per-key rewrite frequency goes up ~32x. What disappears is only
    # the contention between pods, which was never part of what we measure.
    #
    # POD_ORDINAL is derived from the pod name by the container entrypoint, so a
    # plain Deployment works — no StatefulSet needed. Both default to a single
    # unsharded pod, which keeps the original behaviour if they are unset.
    POD_ORDINAL   = int(os.environ.get('POD_ORDINAL', '0'))
    POD_COUNT     = max(1, int(os.environ.get('POD_COUNT', '1')))
    SHARD_HOT     = os.environ.get('SHARD_HOT_KEYS', 'true').lower() == 'true'
    # Never let a slice collapse to nothing when POD_COUNT > HOT_WINDOW.
    HOT_SLICE     = max(1, HOT_WINDOW // POD_COUNT)

    # ── Recent-key re-writes (Iceberg position deletes) ─────────────────────
    # RECENT_KEY_RATIO of the rows in each batch re-write a key THIS worker
    # thread wrote (insert or upsert) within the last RECENT_KEY_MAX_AGE_S
    # seconds. The Iceberg writer turns a re-write into a POSITION delete (a DV
    # on v3) only if the previous write of that key is in the same, still open
    # checkpoint; otherwise it is an equality delete like every first write.
    #
    # Same-checkpoint probability. Checkpoints are ~60s apart (interval 60s,
    # min-pause 30s, so 60s whenever a checkpoint takes under 30s), and their
    # boundaries are unrelated to the generator, so a re-write a seconds after
    # the previous write shares its checkpoint with probability 1 - a/60. With
    # ages spread evenly over [0, MAX_AGE] that averages 1 - MAX_AGE/120: 0.83
    # at 20s, 0.75 at 30s, 0.50 at 60s. The age is never near 0, though: the
    # previous write of a key is at least one same-table batch back for this
    # thread. pick_table() keeps a thread on one table for TABLE_RUN_BATCHES
    # batches so that gap is one batch (2.5-5s at 1,000-2,000 rows/s per
    # thread) instead of ~10 batches for products. A smaller MAX_AGE raises
    # the same-checkpoint share but empties the buffer more often (e.g. on the
    # first batch of a run); the shortfall falls back to the normal path below,
    # and the counter's recent= shows what was actually achieved.
    #
    # Keeping the buffer per thread means a re-write only touches a row whose
    # previous statement (by this same connection, autocommit) has already
    # committed, so it adds no cross-thread or cross-pod row-lock contention,
    # and the row is still in the buffer pool, so it costs no read I/O.
    #
    # Why 0.6 for a 50% target: position share ~= RECENT_KEY_RATIO x (share
    # of re-writes the buffer can serve, ~0.92) x (same-checkpoint
    # probability, ~0.89) + the ~1-2% the hot window already produces. An
    # offline simulation of this planner (real plan_keys/RecentKeys/
    # pick_table, fake clock, fixed 60s checkpoint windows, 8 threads) gave,
    # at ratio 0.6 / max age 20s / runs of 8:
    #     rows/s per thread    500   1000   1500   2000   3000
    #     position share      0.42   0.47   0.49   0.51   0.52
    # with all four tables within +-0.03 of each other. Independent table
    # draws (runs of 1) gave 0.38-0.47 overall and only 0.15-0.30 on products.
    # A DESIGN TARGET, not a measurement: measure it from the Iceberg snapshot
    # summaries (2-DATA-GEN-GUIDE.md) and adjust the ratio. 0 disables the
    # feature and restores the old generator (with TABLE_RUN_BATCHES=1).
    RECENT_RATIO   = float(os.environ.get('RECENT_KEY_RATIO', '0.6'))
    RECENT_MAX_AGE = float(os.environ.get('RECENT_KEY_MAX_AGE_S', '20'))
    # Entries per table per thread. Within a run one table gets all of a
    # thread's rows: ~2,000 rows/s x 20s = ~40,000, so the bound bites only
    # above ~2,500 rows/s per thread or a raised MAX_AGE (it drops the oldest,
    # least useful entries). Caps memory near ~70 MB per pod (THREADS x 4 x
    # this, ~45 bytes an entry).
    RECENT_BUFFER  = int(os.environ.get('RECENT_KEY_BUFFER', '50000'))
    # Consecutive batches a thread spends on one table before re-drawing it
    # (see pick_table). 1 = an independent draw per batch, the old behaviour.
    TABLE_RUN      = max(1, int(os.environ.get('TABLE_RUN_BATCHES', '8')))
    # Read from the server at startup (sample_ids); new AUTO_INCREMENT ids of
    # one statement are LAST_INSERT_ID(), +step, +2*step, ...
    AUTOINC_STEP  = 1

    CITIES = ['Seattle', 'Portland', 'San Francisco', 'Los Angeles', 'Phoenix',
              'Denver', 'Austin', 'Houston', 'Dallas', 'Chicago', 'New York', 'Miami']
    STATES = ['WA', 'OR', 'CA', 'AZ', 'CO', 'TX', 'IL', 'NY', 'MA', 'FL']
    CATEGORIES = ['Electronics', 'Clothing', 'Books', 'Home & Garden', 'Sports',
                  'Toys', 'Food & Beverage', 'Health & Beauty', 'Automotive']
    STATUSES = ['PENDING', 'CONFIRMED', 'SHIPPED', 'DELIVERED', 'CANCELLED']
    PAYMENTS = ['CREDIT_CARD', 'DEBIT_CARD', 'PAYPAL', 'APPLE_PAY', 'GOOGLE_PAY']
    NAMES = ['John Smith', 'Jane Doe', 'Michael Brown', 'Emily Davis', 'David Wilson',
             'Sarah Miller', 'Robert Jones', 'Lisa Garcia', 'James Martinez']

    # ── Shared counters ─────────────────────────────────────────────────────
    _lock = threading.Lock()
    # `recent` is a SUBSET of `upserts` (a re-write of an existing key is an
    # upsert to MySQL), so upserts + inserts == rows still holds.
    STATS = {'rows': 0, 'upserts': 0, 'inserts': 0, 'recent': 0, 'batches': 0,
             'errors': 0}
    PER_TABLE = {}

    def bump(table, rows, upserts, inserts, recent):
        with _lock:
            STATS['rows'] += rows
            STATS['upserts'] += upserts
            STATS['inserts'] += inserts
            STATS['recent'] += recent
            STATS['batches'] += 1
            PER_TABLE[table] = PER_TABLE.get(table, 0) + rows

    def bump_error():
        with _lock:
            STATS['errors'] += 1

    def connect():
        for attempt in range(6):
            try:
                c = mysql.connector.connect(**DB)
                c.autocommit = True
                return c
            except mysql.connector.Error as e:
                print(f"connect attempt {attempt+1} failed: {e}", flush=True)
                time.sleep(3)
        raise SystemExit("could not connect to MySQL")

    def sample_ids():
        """Read the current id ranges once.

        Deliberately MAX(pk) and not a sampled id list: MAX(pk) on an InnoDB
        primary key is an index-max lookup (instant), whereas pulling a list of
        real ids would be a scan of millions of rows and would go stale anyway.
        Customer/product ids are also sampled as real lists because orders and
        order_items carry FOREIGN KEYs to them — an id that was deleted would
        abort the whole multi-row statement, so inserts must use ids known to
        exist rather than a random number below MAX.

        MIN(pk) is read too, for the same price (the other end of the same
        index). The tables are periodically shrunk to their newest ~10% of ids,
        so [1, MAX] is mostly holes: a cold "upsert" drawn below MIN finds no
        row, takes the INSERT path at that old id, and the table regrows. Each
        range is therefore (MIN, MAX); an empty table reads as (1, 1).
        """
        conn = connect()
        cur = conn.cursor()
        ranges = {}
        for table, pk in (('customers', 'customer_id'), ('products', 'product_id'),
                          ('orders', 'order_id'), ('order_items', 'order_item_id')):
            cur.execute(f"SELECT MIN({pk}), MAX({pk}) FROM {table}")
            lo, hi = cur.fetchone()
            hi = hi or 1
            lo = min(lo or 1, hi)
            ranges[table] = (lo, hi)

        # FK parents: a bounded sample, taken off the primary key in id order so
        # it is an index range scan and not a sort.
        cur.execute("SELECT customer_id FROM customers ORDER BY customer_id DESC LIMIT 20000")
        cust = [r[0] for r in cur.fetchall()]
        cur.execute("SELECT product_id FROM products ORDER BY product_id DESC LIMIT 20000")
        prod = [r[0] for r in cur.fetchall()]
        cur.execute("SELECT order_id FROM orders ORDER BY order_id DESC LIMIT 20000")
        ordr = [r[0] for r in cur.fetchall()]
        # The recent-key buffer derives a statement's new ids from
        # LAST_INSERT_ID() and the increment, so read the increment rather than
        # assume 1. The lock mode is printed for the record: for a multi-row
        # VALUES list the server knows the row count up front and reserves one
        # id interval of that size for the statement, so the NULL-pk rows (all
        # last, after explicit ids that are below the counter) get consecutive
        # ids from LAST_INSERT_ID() — not yet verified against this RDS
        # instance (check: recent re-writes should show as upserts, i.e.
        # table row counts grow only by inserts=). If it does not hold, a derived
        # id is either another pod's new row or an unused gap id — the re-write
        # then updates that row or inserts at that id, harmless either way.
        global AUTOINC_STEP
        cur.execute("SELECT @@auto_increment_increment, @@innodb_autoinc_lock_mode")
        step, lock_mode = cur.fetchone()
        AUTOINC_STEP = max(1, int(step or 1))
        cur.close()
        conn.close()
        print(f"id ranges: {ranges}", flush=True)
        print(f"fk samples: customers={len(cust)} products={len(prod)} orders={len(ordr)}",
              flush=True)
        print(f"auto_increment_increment={AUTOINC_STEP} "
              f"innodb_autoinc_lock_mode={lock_mode}", flush=True)
        return ranges, cust, prod, ordr

    def pick_key(id_range, rnd):
        """Choose an existing primary key, skewed towards recent (hot) keys.

        id_range is (MIN(pk), MAX(pk)) from sample_ids(). Every draw stays inside
        it, so an "upsert" never lands on an id below MIN that no longer exists.

        When SHARD_HOT_KEYS is on, this pod's hot draws are confined to its own
        slice of the window so pods do not fight for the same rows — see the
        "Hot-window sharding" note above for the measurements behind that.

        The cold tail (1 - HOT_KEY_RATIO) stays deliberately unsharded and spans
        the full LIVE key range [MIN, MAX]: it is what keeps writes landing across every data
        file rather than only in the newest one, and it is uniform over millions
        of keys, so it contributes almost no lock contention anyway.

        It does, however, contribute enormous READ I/O, which is why the ratio is
        now 0.95 rather than 0.6. Uniform draws over 410M rows / ~100GB miss a
        ~24GB buffer pool almost every time, and an upsert that misses must read
        the page before it can update it. At ratio 0.6 that was 5,655 ReadIOPS —
        43% of the instance's entire 12,000-IOPS budget spent fetching pages the
        benchmark does not care about. Keep the tail small.
        """
        min_id, max_id = id_range
        if rnd.random() < HOT_KEY_RATIO:
            window_lo = max(min_id, max_id - HOT_WINDOW)
            if not SHARD_HOT:
                return rnd.randint(window_lo, max_id)
            lo = window_lo + POD_ORDINAL * HOT_SLICE
            hi = lo + HOT_SLICE - 1
            # A pod whose slice starts past max_id (small table, many pods) would
            # otherwise get an empty range; fall back to the whole window so it
            # still generates load instead of raising ValueError.
            if lo > max_id:
                return rnd.randint(window_lo, max_id)
            return rnd.randint(lo, min(hi, max_id))
        return rnd.randint(min_id, max_id)

    def plan_keys(id_range, n, rnd, recent=None):
        """Plan a batch's primary keys: existing ids ASCENDING, then inserts.

        The ordering is not cosmetic, it is the deadlock fix. InnoDB takes a row
        lock per row of a multi-row upsert, in statement order. With keys in
        random order, two concurrent batches that both touch hot keys A and B can
        grab them in opposite order and deadlock — measured at ~9% of batches
        (errno 1213), and since a deadlock rolls the whole batch back that was a
        straight 9% off the achieved rate (4,630/s against a 5,000/s target).
        Sorting ascending means every session in every pod walks the primary key
        in the same direction, so one simply waits for the other.

        Inserts (pk None -> AUTO_INCREMENT) go last: they take the auto-inc
        values above every existing key, so placing them at the end keeps the
        statement monotonic in key order too.

        The batch is planned in two parts:
          1. RECENT_KEY_RATIO x n rows (stochastically rounded) re-write keys
             from this thread's recent-key buffer for the table — the rows that
             become Iceberg position deletes. If the buffer has fewer distinct
             live keys (pod start, or a small table this thread has not written
             within RECENT_KEY_MAX_AGE_S), the shortfall goes to part 2.
          2. Every remaining row is an upsert via pick_key() with probability
             UPSERT_RATIO, else a new insert — exactly the old behaviour.

        Keys are DISTINCT within the batch. A key listed twice in one
        ON DUPLICATE KEY UPDATE statement is updated twice inside one
        transaction: wasted work, a misleading affected-rows count, and two
        binlog events for one row write. A part-2 draw that collides is redrawn
        a few times and becomes an insert if it keeps colliding (a handful per
        batch at most — the hot slice is ~1M keys per pod).

        Returns (sorted existing keys, n_insert, n_recent).
        """
        seen = set()
        if recent is not None and RECENT_RATIO > 0:
            want = int(n * RECENT_RATIO + rnd.random())
            seen.update(recent.sample(want, rnd))
        n_recent = len(seen)
        ni = 0
        for _ in range(n - n_recent):
            if rnd.random() >= UPSERT_RATIO:
                ni += 1
                continue
            for _try in range(8):
                k = pick_key(id_range, rnd)
                if k not in seen:
                    seen.add(k)
                    break
            else:
                ni += 1
        return sorted(seen), ni, n_recent

    class RecentKeys:
        """Keys one worker thread wrote to one table, with commit timestamps.

        Append-only parallel lists in commit order (so timestamps are sorted),
        with a moving head: expiring entries older than RECENT_KEY_MAX_AGE_S is
        a bisect, and the dead prefix is dropped once it is most of the list.
        A key re-written later appears again with the newer timestamp; the old
        entry is harmless (the key's real last write is even more recent) and
        sample() dedups. Not thread-safe by design — one instance per thread
        per table is the whole point (no shared keys, no shared locks).
        """
        __slots__ = ('ts', 'keys', 'head', 'clock')

        def __init__(self, clock=time.monotonic):
            self.ts, self.keys, self.head, self.clock = [], [], 0, clock

        def _trim(self):
            self.head = max(self.head,
                            bisect.bisect_left(self.ts, self.clock() - RECENT_MAX_AGE,
                                               self.head),
                            len(self.keys) - RECENT_BUFFER)
            if self.head > 4096 and self.head * 2 > len(self.keys):
                del self.ts[:self.head]
                del self.keys[:self.head]
                self.head = 0

        def add(self, keys):
            if not keys:
                return
            self.ts.extend([self.clock()] * len(keys))
            self.keys.extend(keys)
            self._trim()

        def sample(self, k, rnd):
            """Up to k DISTINCT live keys, uniform over live entries."""
            self._trim()
            lo, hi = self.head, len(self.keys)
            if k <= 0 or hi <= lo:
                return []
            if k >= hi - lo:
                return list(set(self.keys[lo:hi]))
            out, keys = set(), self.keys
            # Rejection on duplicates; a bounded number of extra draws keeps a
            # buffer that is mostly repeats of a few keys from spinning.
            for _ in range(2 * k + 16):
                out.add(keys[rnd.randrange(lo, hi)])
                if len(out) >= k:
                    break
            return list(out)

    def rand_text(rnd, n):
        return ''.join(rnd.choice(string.ascii_lowercase) for _ in range(n))

    # ── Batch builders ──────────────────────────────────────────────────────
    # Each returns (sql, params, existing_keys, n_insert, n_recent); recent is
    # this thread's RecentKeys for the table (None = no recent re-writes).
    # n_recent of the existing keys are re-writes from it. Upsert rows carry an
    # explicit existing PK so MySQL takes the ON DUPLICATE KEY UPDATE path;
    # insert rows pass NULL for the AUTO_INCREMENT PK so MySQL assigns a new one.

    def batch_orders(rnd, ranges, cust, prod, ordr, n, recent=None):
        rows, params = [], []
        keys, ni, nr = plan_keys(ranges['orders'], n, rnd, recent)
        for pk in keys + [None] * ni:
            rows.append("(%s,%s,%s,%s,%s,%s,%s)")
            params.extend([
                pk,
                rnd.choice(cust),
                datetime.utcnow(),
                round(rnd.uniform(10, 5000), 2),
                rnd.choice(STATUSES),
                rnd.choice(PAYMENTS),
                f"{rnd.randint(100,9999)} Load Test Way, {rnd.choice(CITIES)}",
            ])
        sql = (
            "INSERT INTO orders (order_id, customer_id, order_date, total_amount,"
            " order_status, payment_method, shipping_address) VALUES "
            + ",".join(rows) +
            # Changing order_status/total_amount guarantees the row differs, which
            # is what makes `updated_at ON UPDATE CURRENT_TIMESTAMP` actually fire.
            # MySQL skips the ON UPDATE timestamp when an update is a no-op, and
            # the hot-window queries filter on updated_at, so a no-op upsert would
            # be invisible to the very queries being benchmarked.
            " ON DUPLICATE KEY UPDATE order_status=VALUES(order_status),"
            " total_amount=VALUES(total_amount), payment_method=VALUES(payment_method),"
            " shipping_address=VALUES(shipping_address)"
        )
        return sql, params, keys, ni, nr

    def batch_order_items(rnd, ranges, cust, prod, ordr, n, recent=None):
        rows, params = [], []
        keys, ni, nr = plan_keys(ranges['order_items'], n, rnd, recent)
        for pk in keys + [None] * ni:
            rows.append("(%s,%s,%s,%s,%s,%s)")
            params.extend([
                pk,
                rnd.choice(ordr),
                rnd.choice(prod),
                rnd.randint(1, 10),
                round(rnd.uniform(5, 900), 2),
                datetime.utcnow(),
            ])
        # subtotal is GENERATED ALWAYS AS (quantity * unit_price) STORED, so it
        # must NOT appear in the column list — MySQL rejects an explicit value for
        # a stored generated column ("The value specified for generated column").
        sql = (
            "INSERT INTO order_items (order_item_id, order_id, product_id, quantity,"
            " unit_price, created_at) VALUES "
            + ",".join(rows) +
            " ON DUPLICATE KEY UPDATE quantity=VALUES(quantity),"
            " unit_price=VALUES(unit_price)"
        )
        return sql, params, keys, ni, nr

    def batch_customers(rnd, ranges, cust, prod, ordr, n, recent=None):
        rows, params = [], []
        keys, ni, nr = plan_keys(ranges['customers'], n, rnd, recent)
        for pk in keys + [None] * ni:
            rows.append("(%s,%s,%s,%s,%s,%s,%s,%s,%s)")
            # email carries a UNIQUE KEY. Always generate a globally unique value
            # so an insert cannot collide on it: a UNIQUE-key collision would take
            # the ON DUPLICATE KEY UPDATE path against a DIFFERENT row than the PK
            # intended, quietly corrupting the key distribution this test relies on.
            uniq = f"{rand_text(rnd,10)}{rnd.getrandbits(48):012x}"
            rows_city = rnd.choice(CITIES)
            params.extend([
                pk,
                rnd.choice(NAMES),
                f"{uniq}@loadtest.example.com",
                f"+1-{rnd.randint(200,999)}-{rnd.randint(200,999)}-{rnd.randint(1000,9999)}",
                f"{rnd.randint(100,9999)} {rnd.choice(['Main','Oak','Maple','Cedar'])} St",
                rows_city,
                rnd.choice(STATES),
                'USA',
                f"{rnd.randint(10000,99999)}",
            ])
        sql = (
            "INSERT INTO customers (customer_id, customer_name, email, phone, address,"
            " city, state, country, zip_code) VALUES "
            + ",".join(rows) +
            " ON DUPLICATE KEY UPDATE customer_name=VALUES(customer_name),"
            " phone=VALUES(phone), address=VALUES(address), city=VALUES(city),"
            " state=VALUES(state), zip_code=VALUES(zip_code)"
        )
        return sql, params, keys, ni, nr

    def batch_products(rnd, ranges, cust, prod, ordr, n, recent=None):
        rows, params = [], []
        keys, ni, nr = plan_keys(ranges['products'], n, rnd, recent)
        for pk in keys + [None] * ni:
            rows.append("(%s,%s,%s,%s,%s,%s)")
            params.extend([
                pk,
                f"Item {rand_text(rnd,6)} Model {rnd.randint(100,999)}",
                rnd.choice(CATEGORIES),
                round(rnd.uniform(9.99, 999.99), 2),
                rnd.randint(0, 1000),
                f"Load test product {rand_text(rnd,12)}",
            ])
        sql = (
            "INSERT INTO products (product_id, product_name, category, price,"
            " stock_quantity, description) VALUES "
            + ",".join(rows) +
            " ON DUPLICATE KEY UPDATE product_name=VALUES(product_name),"
            " price=VALUES(price), stock_quantity=VALUES(stock_quantity),"
            " description=VALUES(description)"
        )
        return sql, params, keys, ni, nr

    # Table mix, weighted to resemble the shape of the existing data (order_items
    # is the largest table, customers/products the smallest). The weights decide
    # how the 40k/s is split, so all four tables get meaningful upsert traffic
    # rather than the fact tables drowning out the dimensions.
    MIX = [
        (batch_order_items, 'order_items', 45),
        (batch_orders,      'orders',      30),
        (batch_customers,   'customers',   15),
        (batch_products,    'products',    10),
    ]
    _builders = [m[0] for m in MIX]
    _names    = [m[1] for m in MIX]
    _weights  = [m[2] for m in MIX]

    def pick_table(rnd, run):
        """Weighted table choice, held for TABLE_RUN_BATCHES consecutive batches.

        run is this thread's [table index, batches left]. The long-run mix is
        unchanged (each run's table is drawn with the MIX weights). What the
        run changes is how long ago this thread last wrote the table: with one
        independent draw per batch, products (10%) comes back after ~10
        batches, i.e. ~25-50s at 1,000-2,000 rows/s per thread — past
        RECENT_KEY_MAX_AGE_S and often past the checkpoint, so its recent-key
        buffer is empty or its re-writes become equality deletes. Inside a run
        the previous same-table batch is one batch (a few seconds) back, so a
        re-write shares its checkpoint ~95% of the time; only the first batch
        of a run has nothing recent to draw on. With independent draws the
        offline simulation put products/customers at 0.15-0.35 position share
        against 0.5-0.6 for order_items.
        """
        if run[1] <= 0:
            run[0] = rnd.choices(range(len(MIX)), weights=_weights, k=1)[0]
            run[1] = TABLE_RUN
        run[1] -= 1
        return _builders[run[0]], _names[run[0]]

    def worker(idx, ranges, cust, prod, ordr, rate, stop_at):
        rnd = random.Random(os.getpid() * 1000 + idx)
        conn = connect()
        cur = conn.cursor()
        # This thread's own recent-key buffers, one per table. Never shared:
        # see the RECENT_KEY_RATIO note at the top for why that matters.
        recent = {n: RecentKeys() for n in _names} if RECENT_RATIO > 0 else {}
        run = [0, 0]
        # Token bucket: tokens accrue at `rate` rows/sec and a batch spends
        # BATCH_ROWS of them. Sleeping for the shortfall (rather than a fixed
        # interval) keeps the long-run average at the target even when an
        # individual batch stalls on the server.
        tokens = 0.0
        last = time.monotonic()
        while stop_at == 0 or time.monotonic() < stop_at:
            now = time.monotonic()
            tokens += (now - last) * rate
            last = now
            if tokens < BATCH_ROWS:
                time.sleep((BATCH_ROWS - tokens) / rate)
                continue
            tokens -= BATCH_ROWS

            builder, name = pick_table(rnd, run)
            buf = recent.get(name)
            sql, params, keys, ni, nr = builder(rnd, ranges, cust, prod, ordr,
                                                BATCH_ROWS, buf)
            nu = len(keys)
            # Deadlock (1213) and lock-wait timeout (1205) roll back the WHOLE
            # multi-row statement, so dropping the batch costs BATCH_ROWS rows off
            # the achieved rate — that is exactly why the first run landed at
            # 4,630/s against a 5,000/s target. Retry the same statement instead;
            # it is idempotent (fixed keys, fixed values) and the ascending key
            # order in plan_keys() means the retry will not lose the race twice
            # for the same reason.
            for attempt in range(4):
                try:
                    cur.execute(sql, params)
                    # nu + ni is BATCH_ROWS except when plan_keys() turned a
                    # colliding draw into an insert — it is always the real
                    # number of rows in the statement.
                    bump(name, nu + ni, nu, ni, nr)
                    # Only COMMITTED rows enter the buffer (autocommit: the
                    # statement returning means its locks are released), with
                    # the commit time as their age. New rows' ids come from
                    # LAST_INSERT_ID(): the NULL-pk rows are last in the
                    # statement and get one consecutive interval.
                    if buf is not None:
                        first = cur.lastrowid
                        if ni and first:
                            keys = keys + list(range(first, first + ni * AUTOINC_STEP,
                                                     AUTOINC_STEP))
                        buf.add(keys)
                    break
                except mysql.connector.Error as e:
                    bump_error()
                    if e.errno in (1213, 1205) and attempt < 3:
                        continue
                    # Connection genuinely gone — rebuild it and drop this batch.
                    if e.errno in (2006, 2013, 2055):
                        try:
                            cur.close(); conn.close()
                        except Exception:
                            pass
                        conn = connect()
                        cur = conn.cursor()
                        break
                    if e.errno not in (1213, 1205):
                        print(f"[w{idx}] {name}: {e}", flush=True)
                    break
        try:
            cur.close(); conn.close()
        except Exception:
            pass

    def main():
        print("=" * 70, flush=True)
        print("MySQL UPSERT load generator", flush=True)
        print(f"  target      : {RATE} rows/sec (this pod)", flush=True)
        print(f"  threads     : {THREADS}   batch rows: {BATCH_ROWS}", flush=True)
        print(f"  upsert ratio: {UPSERT_RATIO}  hot-key ratio: {HOT_KEY_RATIO}"
              f"  hot window: {HOT_WINDOW}", flush=True)
        print(f"  recent keys : ratio {RECENT_RATIO}  max age {RECENT_MAX_AGE:g}s"
              f"  buffer {RECENT_BUFFER}/table/thread  table run {TABLE_RUN} batches"
              f"  (upsert ratio applies to the other {1 - RECENT_RATIO:.2f})",
              flush=True)
        print(f"  table mix   : " + ", ".join(f"{n}={w}%" for _, n, w in MIX), flush=True)
        print("=" * 70, flush=True)

        ranges, cust, prod, ordr = sample_ids()
        if not cust or not prod or not ordr:
            raise SystemExit("FK parent samples are empty — is the database seeded?")

        stop_at = (time.monotonic() + DURATION) if DURATION else 0
        per_thread = RATE / float(THREADS)
        threads = []
        for i in range(THREADS):
            t = threading.Thread(target=worker,
                                 args=(i, ranges, cust, prod, ordr, per_thread, stop_at),
                                 daemon=True)
            t.start()
            threads.append(t)

        t0 = time.monotonic()
        last_rows, last_t = 0, t0
        while any(t.is_alive() for t in threads):
            time.sleep(REPORT_EVERY)
            with _lock:
                snap = dict(STATS)
                tables = dict(PER_TABLE)
            now = time.monotonic()
            inst = (snap['rows'] - last_rows) / (now - last_t)
            avg = snap['rows'] / (now - t0)
            last_rows, last_t = snap['rows'], now
            mix = " ".join(f"{k}={v}" for k, v in sorted(tables.items()))
            print(f"[{int(now - t0):5d}s] rows={snap['rows']:,} "
                  f"inst={inst:,.0f}/s avg={avg:,.0f}/s "
                  f"upserts={snap['upserts']:,} inserts={snap['inserts']:,} "
                  f"recent={snap['recent']:,} batches={snap['batches']:,} errors={snap['errors']} | {mix}",
                  flush=True)

        print("load generation finished", flush=True)

    if __name__ == '__main__':
        main()
---
# Headless Service exists only to satisfy the StatefulSet's serviceName
# requirement — nothing connects TO these pods, they are outbound writers. No
# ClusterIP is allocated and no DNS load balancing happens.
apiVersion: v1
kind: Service
metadata:
  name: mysql-upsert-loadgen
  namespace: emr-flink
  labels:
    app: mysql-upsert-loadgen
spec:
  clusterIP: None
  selector:
    app: mysql-upsert-loadgen
  ports:
  - name: placeholder
    port: 9999
---
# A StatefulSet rather than a Deployment, purely for stable ordinals. Each pod
# owns a disjoint slice of the hot-key window (see SHARD_HOT_KEYS), and a
# StatefulSet names its pods mysql-upsert-loadgen-0..N-1, so the ordinal is
# exact. The previous Deployment had to hash its random pod-name suffix into
# [0, POD_COUNT), which collided: 8 pods produced only 6 distinct ordinals in
# testing, leaving two pairs sharing a slice and still contending.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-upsert-loadgen
  namespace: emr-flink
  labels:
    app: mysql-upsert-loadgen
spec:
  serviceName: mysql-upsert-loadgen
  # Start and stop all pods at once. The default OrderedReady brings pods up one
  # at a time, which for a 32-pod load test means a long ramp during which the
  # achieved rate is meaningless — and on scale-down it would drain the highest
  # ordinals serially while the benchmark waits.
  podManagementPolicy: Parallel
  # 8 pods x THREADS 4 = 32 MySQL connections, holding the same ~69,000 rows/sec
  # that 32 pods (128 connections) reached. Throughput here is set by BATCH_ROWS
  # (rows per commit), not by how many clients are connected.
  #
  # Pod count is deliberately NOT the throughput knob. find-rds-ceiling.sh swept
  # 8/16/24/32/40 replicas against db.m5.2xlarge (500GB gp3, 12,000 IOPS):
  #
  #   replicas  conns  target    achieved  errors   write_iops  rds_cpu
  #    8         32     40,000    34,989      984     7,363      32%
  #   16         64     80,000    58,265    5,960     8,013      47%
  #   32        128    160,000    68,818   17,248     7,997      48%
  #   40        160    200,000    66,404   23,843     7,481      46%
  #
  # Past 32 replicas the extra pods only bought row-lock contention — that is what
  # the errors column counts, and why 40 replicas is SLOWER than 32. Adding
  # clients to an already-saturated server cannot help.
  #
  # CORRECTION: this sweep was originally read as "the wall is InnoDB's
  # single-writer commit path", because it only looked at WriteIOPS. That was
  # wrong. Performance Insights puts the commit path at effectively zero load
  # (wait/io/file/sql/binlog 0.043, MYSQL_BIN_LOG::COND_done 0.003) while
  # wait/io/table/sql/handler sits at 26.3 — plain storage I/O. The missing term
  # was READS: ReadIOPS 5,655 + WriteIOPS 6,518 = 11,878 of 12,000 provisioned.
  # The instance was IOPS-saturated, not commit-bound, and the reads came from the
  # cold-tail key distribution (see the HOT_KEY_RATIO note below). Fixing that
  # alone took throughput from ~15,000 to ~58,300 rows/s at these same 8 replicas
  # and moved the bottleneck to CPU (26% -> 78%).
  #
  # So the same rows are moved with 4x fewer connections by committing in larger
  # batches: 32 connections x 2,000-row batches instead of 128 x 500. Fewer,
  # bigger commits amortize the redo-log flush that is the actual bottleneck, and
  # cut the lock-timeout errors that 128 competing writers produced. See
  # bench-results/rds-ceiling-20260923T081657Z.csv.
  #
  # 2026-11-02: 8 -> 4 replicas (POD_COUNT 4 with it).
  replicas: 4
  selector:
    matchLabels:
      app: mysql-upsert-loadgen
  template:
    metadata:
      labels:
        app: mysql-upsert-loadgen
    spec:
      # Keep the load generators off the Flink TaskManager nodepool. Sharing it
      # would have the generator competing for CPU with the very pipeline whose
      # throughput is being measured.
      nodeSelector:
        karpenter.sh/nodepool: driver-nodepool
      containers:
      - name: loadgen
        image: python:3.11-slim
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e
            # mysql-connector-python ships the C extension (_mysql_connector) as
            # a separate wheel. Without it, use_pure=False raises at connect()
            # time, so install it explicitly rather than relying on the default.
            pip install --quiet mysql-connector-python
            python - <<'PY'
            try:
                import _mysql_connector  # noqa: F401
                print("mysql C extension: available", flush=True)
            except ImportError:
                print("mysql C extension: MISSING - set USE_PURE=true or the "
                      "pod will fail at connect()", flush=True)
            PY

            # This pod's ordinal decides which slice of the hot-key window it
            # owns (see SHARD_HOT_KEYS). As a StatefulSet, the pod name is
            # mysql-upsert-loadgen-<n> with n in 0..replicas-1, so the trailing
            # field IS the ordinal — exact, stable across restarts, and
            # collision-free. That is the reason this workload is a StatefulSet
            # and not a Deployment: a Deployment's random name suffix had to be
            # hashed into [0, POD_COUNT), and hashing collided (8 pods produced
            # 6 distinct ordinals, so two pairs shared a slice and still fought
            # over the same rows).
            #
            # The md5 fallback remains for the case where this manifest is run as
            # a plain Deployment: it keeps such a pod working (spread, if
            # imperfectly) rather than crashing on a non-numeric suffix.
            if [[ -z "${POD_ORDINAL:-}" ]]; then
              suffix="${HOSTNAME##*-}"
              if [[ "$suffix" =~ ^[0-9]+$ ]]; then
                export POD_ORDINAL="$suffix"
              else
                echo "WARNING: pod name '$HOSTNAME' has no numeric ordinal —" \
                     "not a StatefulSet? Falling back to a hashed ordinal," \
                     "which can collide and leave pods sharing a key slice."
                export POD_ORDINAL=$(( 0x$(printf '%s' "$HOSTNAME" | md5sum | cut -c1-6) % ${POD_COUNT:-1} ))
              fi
            fi
            echo "pod=$HOSTNAME ordinal=$POD_ORDINAL of ${POD_COUNT:-1}"
            exec python /scripts/upsert_loadgen.py
        env:
        # Credentials come from the existing secret; the password is never a
        # command-line argument or a literal in this manifest.
        - name: MYSQL_HOST
          valueFrom:
            secretKeyRef: { name: mysql-credentials, key: hostname }
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef: { name: mysql-credentials, key: username }
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef: { name: mysql-credentials, key: password }
        - name: MYSQL_DATABASE
          value: "ecommerce"
        # 8 pods x 100,000 = 800,000 rows/sec of TARGET. RATE is a token-bucket
        # ceiling, not a promise, and this target is far above anything this
        # instance has delivered (best measured: 94,327 at 8 pods). Setting it
        # well past the achievable rate is deliberate — the bucket then never
        # binds, so the pods run flat out and whatever they reach is the real
        # limit of MySQL plus the driver rather than an artifact of the generator
        # throttling itself. Do not read this number as a throughput claim:
        # measure `inst=` from the pod logs. `avg=` is a lifetime average and is
        # useless after a settings change.
        #
        # 800k/s is NOT reachable on a single db.m5.2xlarge, and the arithmetic
        # says so before the test does. Measured per-row cost is 0.198 write
        # IOPS/row and 3.36 KB/row, so 800k rows/s needs ~158,400 IOPS and
        # ~2,625 MB/s. The gp3 volume is provisioned at 64,000 IOPS (gp3's
        # maximum), which caps sustained throughput near ~323,000 rows/s — and
        # that ceiling was confirmed once already, at ~330,000 rows/s with
        # WriteIOPS reading 65,310 of 64,000 (102%). Reaching 800k needs either
        # io2 with more IOPS on a bigger instance, or sharding across ~3
        # instances. Expect this target to be clipped by storage, and read the
        # gap between target and `inst=` as the headroom measurement it is.
        - name: RATE_PER_POD
          value: "80000"
        - name: THREADS
          value: "8"
        # 10,000 -> 5,000. REVERTED: 10,000 was tried and measured WORSE, which
        # settles the lock-hold question the earlier note left open.
        #
        # The reasoning for going up was that the bottleneck is commits/sec
        # against the redo log, so fewer, larger commits move the same rows with
        # fewer flushes. That holds up to about 5,000 and then inverts, because a
        # batch is ONE transaction holding every row lock it touches for the
        # whole statement. At 10,000 rows the hold window is long enough that
        # 8 threads x 8 pods = 64 concurrent writers collide constantly.
        #
        # Measured at 10,000 (per pod, 240s after rollout): inst= 4,000/s against
        # a 100,000/s target, with 53 of 130 batches erroring — a ~40% batch
        # failure rate. Aggregate across 8 pods was ~30,000/s, an order of
        # magnitude below where 5,000 had been running.
        #
        # The errors are 1213 (deadlock) and 1205 (lock-wait timeout), NOT the
        # 1153 max_allowed_packet breach the previous note worried about. Those
        # two errnos are retried silently in worker() and never printed, so they
        # only show up in the `errors=` counter — which is why this looked like a
        # stall rather than an error storm. Each rollback discards the entire
        # multi-row statement, so a failed batch costs BATCH_ROWS rows off the
        # achieved rate, and the 4 retry attempts serialize behind the same
        # contention that caused the first failure.
        #
        # RDS was NOT the wall here, which is what makes this conclusive: during
        # the 10,000 run WriteIOPS sat at 7,900-11,800 of 64,000 provisioned
        # (~18%), WriteThroughput ~134-205 MB/s of 2,500, and WriteLatency 0.
        # Storage had ~5x headroom and the generator still could not use it.
        # DiskQueueDepth 18-76 alongside idle IOPS is the signature of requests
        # queued behind lock waits rather than behind the device.
        #
        # 5,000 is the measured optimum for this workload shape. Do not raise it
        # again without also reducing concurrency (THREADS x replicas); the two
        # multiply into the collision rate.
        - name: BATCH_ROWS
          value: "5000"
        # Of the rows that are NOT recent re-writes (1 - RECENT_KEY_RATIO = 40%),
        # 90% update a hot/cold key from pick_key() and 10% are new inserts.
        # Stream-wide that is at most 60% recent re-writes, 36% hot/cold upserts
        # and 4% inserts (the simulation achieved ~55% recent; a short buffer
        # hands its rows to this split), so the source tables grow at ~4-5% of
        # the row rate. Raised 0.5 -> 0.9 on 2026-11-02: at 0.5 (50% inserts, no
        # recent re-writes) 4 pods inserted ~370M rows in 4 h, the tables
        # outgrew the buffer pool and the rate fell from ~85K to ~30K rows/s.
        - name: UPSERT_RATIO
          value: "0.9"
        # 2026-11-02, Iceberg v3. Share of each batch that re-writes a key this
        # thread wrote in the last RECENT_KEY_MAX_AGE_S seconds, so that about
        # half of the Iceberg writer's deletes become POSITION deletes (DVs on
        # v3) instead of the ~2% measured before (orders: 0.5M position vs 28.3M
        # equality). 0.6 rather than 0.5 because not every re-write can be
        # served or lands in the same checkpoint; the derivation and the offline
        # simulation (0.47-0.51 position share at 1,000-2,000 rows/s per thread)
        # are in the RECENT_KEY_RATIO note in the script. A design target, not a
        # measurement: check added-position-deletes against
        # added-equality-deletes in the Iceberg snapshot summaries and adjust.
        #
        # Expected side effects, not yet measured: re-written rows are hot in
        # the buffer pool and were committed by this same connection, so there is
        # no new read I/O and no new row-lock contention; but fewer rows are new
        # inserts and more are updates (an update writes undo + redo for the old
        # row image), so achieved rows/s may shift either way. Paimon receives
        # the same stream and collapses the repeats in its write buffer, which
        # is the intended asymmetry, not a Paimon problem.
        - name: RECENT_KEY_RATIO
          value: "0.6"
        # Well under the 60s checkpoint interval: a re-write of a key last
        # written a seconds ago shares its checkpoint with probability 1 - a/60.
        - name: RECENT_KEY_MAX_AGE_S
          value: "20"
        # Batches in a row a thread spends on one table. Long-run table mix is
        # unchanged; it keeps the previous same-table batch one batch back so the
        # small tables (products 10%, customers 15%) get recent keys too. 1 is the
        # old one-draw-per-batch behaviour.
        - name: TABLE_RUN_BATCHES
          value: "8"
        # 0.6 -> 0.95, and the window 50,000 -> 2,000,000. Together these took
        # aggregate throughput from ~15,000 rows/s to ~58,300 (3.9x). Both move
        # the same direction, for two different reasons:
        #
        # The ratio is the IOPS fix. The old cold tail (1 - 0.6 = 40% of upserts)
        # drew uniformly across 410M rows / ~100GB against a ~24GB buffer pool, so
        # nearly every cold upsert paid a random disk READ to fetch the page before
        # updating it. Measured: ReadIOPS 5,655 alongside WriteIOPS 6,518, i.e.
        # 11,878 of the 12,000 provisioned IOPS consumed with 43% of them reads,
        # DiskQueueDepth 34.7, CPU idle at 26%. Raising the ratio dropped ReadIOPS
        # to 1,484 (-74%) and the queue to 6.8, freeing the IOPS for writes. That
        # read traffic bought the benchmark nothing — it was cache-miss noise.
        #
        # The window is the lock fix, and it is what makes the higher ratio safe:
        # concentrating 95% of writes into the OLD 50,000-key window would have
        # rebuilt the lock convoy described in the sharding note above. At 2,000,000
        # (HOT_SLICE = 250,000 keys per pod) the same rows are still rewritten many
        # times per hour at these rates, so Iceberg's equality-delete files still
        # accumulate and Paimon's LSM still compacts them — the effect the
        # comparison exists to measure is preserved, and in fact strengthened,
        # since a larger share of writes is now repeat-key.
        - name: HOT_KEY_RATIO
          value: "0.6"
        # 5,000,000 — sized to the BUFFER POOL, which is the constraint that
        # actually governs this number. Everything above is still true, but it
        # missed the ceiling: a window only behaves as "hot" while the rows it
        # spans fit in memory. Past that the hot half misses cache just like the
        # cold tail and the skew buys nothing.
        #
        # The arithmetic. Rows are ~3.36 KB, so a window of N keys spans
        # N x 3.36 KB. The buffer pool is innodb_buffer_pool_size =
        # {DBInstanceClassMemory*3/4} on a db.m5.2xlarge (32 GiB) => ~24 GB.
        #   200,000,000 keys ->  641 GB   = 27x the pool   (what was running)
        #     5,000,000 keys ->   16 GB   = fits, with room for the cold tail
        # Per pod, HOT_SLICE = window / POD_COUNT: 25,000,000 keys / 80 GB before
        # vs 625,000 keys / 2 GB now.
        #
        # What 200,000,000 measured (8 pods, BATCH_ROWS 5,000, ratio 0.5):
        #   ReadIOPS 6,619 ~= WriteIOPS 8,690 — nearly every upsert paid a random
        #     disk read to fetch the page before updating it
        #   CPUUtilization 60-73% on 8 vCPU
        #   WriteIOPS 8,690 of 64,000 provisioned (14%), 143 MB/s of 2,500,
        #     WriteLatency 0 — storage had ~7x headroom and could not be used
        #   ~50% of batches failing (pod-0: 85 errors / 154 batches), ~3,000 rows/s
        #     per pod against a 100,000 target
        # Storage was never the wall; buffer-pool misses and CPU were.
        #
        # This does NOT weaken the Paimon-vs-Iceberg comparison — it strengthens
        # it, for the same reason the sharding note gives. A narrower window makes
        # each key ~40x HOTTER, so Iceberg accumulates equality-delete files
        # faster and Paimon's LSM has more to compact. That divergence is the
        # entire point of the benchmark.
        #
        # Expect lock errors (1213/1205) to PERSIST: concentrating writes raises
        # per-key contention even as it fixes the cache misses. Those two pull in
        # opposite directions, so judge this by achieved rows/s, not by the error
        # count alone. If throughput does not improve, the next lever is the
        # instance itself (more vCPU and a bigger pool), not this number.
        #
        # Re-derive this if the instance class or row width changes:
        #   window = 0.65 x buffer_pool_bytes / avg_row_bytes
        - name: HOT_KEY_WINDOW
          value: "5000000"
        - name: REPORT_SECONDS
          value: "15"
        # Run forever. Was 3600 for a bounded one-hour measurement, but the
        # StatefulSet restarts each pod the moment it self-exits, so the pods
        # cycled 4-5 times and every "average rows/sec" reading was diluted by
        # a fresh ramp-up. Bound a measurement window by scaling the StatefulSet
        # down instead, which stops all pods at the same moment without the
        # restart loop.
        - name: DURATION_SECONDS
          value: "0"
        # Hot-window sharding. POD_COUNT must track `replicas` above: it is the
        # divisor that sizes each pod's slice, and the deploy script keeps the two
        # in step on `scale`. If it drifts low, slices overlap and the lock
        # convoy comes back; if it drifts high, part of the window goes unwritten
        # (harmless, just less hot-key pressure than intended).
        - name: POD_COUNT
          value: "4"
        - name: SHARD_HOT_KEYS
          value: "true"
        # Pure-Python protocol fallback. Leave false to use the C extension,
        # which is what lifts a pod past the ~5,000 rows/s GIL ceiling.
        - name: USE_PURE
          value: "false"
        volumeMounts:
        - name: script
          mountPath: /scripts
        # Raised 2 -> 4 CPU when RATE_PER_POD went to 8000. At 2 cores a pod
        # cannot reach 8,000 rows/s: the driver burns real CPU building the
        # 2,000-row multi-row statement text, so the ceiling is the GIL plus the
        # C extension's encode loop, not MySQL. Requests go 1 -> 2 so the
        # scheduler reserves enough to actually run the threads rather than
        # letting them fight over one core under contention.
        resources:
          requests:
            memory: "2Gi"
            cpu: "2"
          limits:
            memory: "4Gi"
            cpu: "4"
      volumes:
      - name: script
        configMap:
          name: mysql-upsert-loadgen-script
