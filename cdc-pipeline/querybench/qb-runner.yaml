# In-cluster Job for a CDC query test or its watcher (cdc-pipeline/querybench/run.sh
# start; Jobs cdc-qb-runner / cdc-qb-watch, never the throughput benchmark's
# qb-runner / qb-watch). Copied from throughput-benchmark/querybench/qb-runner.yaml;
# what differs: the names, statefulsets/scale (the CDC generator is the
# StatefulSet mysql-upsert-loadgen), pods delete (the snapshot test empties the
# caches from inside the runner) and the bundle layout (cdc-pipeline/ subset).
# Rendered with envsubst over NAME, NAMESPACE, KUBECTL_VERSION and ROLE_ARN only:
# every other $... below is for the container's shell and stays literal.
#
# Permissions: a namespace Role, nothing cluster-wide. Exec into the Trino
# coordinator (the trino CLI runs there: querybench/trino.sh) and the DuckDB
# servers, restart both engines' Deployments (clear-caches.sh: DuckDB, and
# engine-deploy/deploy-trino.sh clear-cache, which also execs into every Trino
# pod), read and suspend the Flink writers, read the other runner's Job, scale
# the generator and the job monitor to 0, take duckdb-warm-cdc down, scale
# Trino to 0 and delete the runner's ConfigMap and Secret (qb-watch.sh).
# No JDK or trino CLI in this image: the coordinator's own CLI is used.
#
# AWS: the ServiceAccount assumes the execution role (IRSA; its trust already
# covers every ServiceAccount in the namespace), so the runner can pin the
# tables (Glue GetTable, S3 copy to querybench-pins/) and upload its
# bench-results/ to S3 when the test ends.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${NAME}
  namespace: ${NAMESPACE}
  annotations: {eks.amazonaws.com/role-arn: "${ROLE_ARN}"}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: ${NAME}, namespace: ${NAMESPACE}}
rules:
- {apiGroups: [""], resources: [pods, pods/log], verbs: [get, list, watch]}
# clear-caches.sh runs IN the runner for the snapshot test (cold start)
- {apiGroups: [""], resources: [pods], verbs: [delete]}
- {apiGroups: [""], resources: [pods/exec, pods/portforward], verbs: [create, get]}
- {apiGroups: [apps], resources: [deployments, replicasets], verbs: [get, list, watch, patch, delete]}
- {apiGroups: [apps], resources: [statefulsets], verbs: [get, list, watch]}
- {apiGroups: [apps], resources: [deployments/scale, statefulsets/scale], verbs: [get, patch, update]}
- {apiGroups: [""], resources: [configmaps, secrets], verbs: [delete]}
- {apiGroups: [flink.apache.org], resources: [flinkdeployments], verbs: [get, list, patch]}
- {apiGroups: [batch], resources: [jobs], verbs: [get, list, delete]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: ${NAME}, namespace: ${NAMESPACE}}
subjects: [{kind: ServiceAccount, name: ${NAME}, namespace: ${NAMESPACE}}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: ${NAME}}
---
apiVersion: batch/v1
kind: Job
metadata: {name: ${NAME}, namespace: ${NAMESPACE}, labels: {app: ${NAME}}}
spec:
  backoffLimit: 0                       # no restart: a re-run would requery and double-record
  activeDeadlineSeconds: 86400          # 1 day: the longest a test may run
  ttlSecondsAfterFinished: 86400        # keep the finished Job and its log a day, then delete it
  template:
    metadata:
      labels: {app: ${NAME}}
      annotations:
        karpenter.sh/do-not-disrupt: "true"
        instrumentation.opentelemetry.io/inject-java: "false"
        instrumentation.opentelemetry.io/inject-python: "false"
        instrumentation.opentelemetry.io/inject-nodejs: "false"
        instrumentation.opentelemetry.io/inject-dotnet: "false"
    spec:
      restartPolicy: Never
      serviceAccountName: ${NAME}
      nodeSelector:
        karpenter.sh/nodepool: driver-nodepool
        karpenter.sh/capacity-type: on-demand
        kubernetes.io/arch: amd64
      containers:
      - name: runner
        image: python:3.12-slim
        resources: {requests: {cpu: "500m", memory: 1Gi}, limits: {cpu: "1", memory: 2Gi}}
        env: [{name: NAMESPACE, value: "${NAMESPACE}"}]
        volumeMounts:
        - {name: bundle, mountPath: /bundle}       # querybench/, lib/, engine-deploy/, .bench-env, .qb-runner-cmd.sh
        - {name: env, mountPath: /env}             # .bench-env.local
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -uo pipefail
          apt-get update -qq >/dev/null && apt-get install -y -qq curl procps >/dev/null
          pip install -q --no-cache-dir awscli >/dev/null 2>&1 || echo "awscli install failed: results will not upload"
          curl -fsSLo /usr/local/bin/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x /usr/local/bin/kubectl
          kubectl version --client >/dev/null || { echo "kubectl ${KUBECTL_VERSION} does not run here"; exit 1; }
          mkdir -p /work && tar -C /work -xzf /bundle/bundle.tgz && cp /env/bench-env-local /work/.bench-env.local
          mkdir -p /work/bench-results && cd /work
          echo "== runner $(date -u)"; sed -n 's/^# step: /== step: /p' .qb-runner-cmd.sh
          bash .qb-runner-cmd.sh; rc=$?
          echo "status: runner-exit=${rc} $(date -u)"
          exit "$rc"
      volumes:
      - {name: bundle, configMap: {name: ${NAME}}}
      - {name: env, secret: {secretName: ${NAME}}}
