# DuckDB benchmark Job for the throughput project's cid_events table.
#
# Sizing — CPU/memory PARITY with StarRocks, on a single Karpenter node.
#
# StarRocks is a distributed MPP engine: 3 BEs at 6 cpu / 24Gi limits each,
# i.e. 18 cpu / 72Gi aggregate across three nodes, plus an FE. DuckDB is a
# single process, so the whole 18 cpu / 72Gi has to fit on ONE node — hence the
# m5.8xlarge (32 vcpu / 128Gi) selector rather than the cluster's pre-existing
# m5.4xlarge nodes, which cannot hold it.
#
# What is still NOT equal, and must be stated with any ratio: StarRocks has
# three nodes' worth of aggregate memory bandwidth, page cache and NIC, while
# DuckDB has one node's. CPU, RAM and arch are at parity; locality is not, and
# it favours neither uniformly — one fat node has cheaper joins but a single
# network pipe to S3. At ~8 TiB per table that pipe is the binding constraint on
# the wide-JSON queries.
#
apiVersion: batch/v1
kind: Job
metadata:
  name: duckdb-cid-bench
  namespace: emr-flink
spec:
  backoffLimit: 0          # a failed benchmark must not silently re-run and requery
  completions: 1
  parallelism: 1
  template:
    metadata:
      annotations:
        karpenter.sh/do-not-disrupt: "true"
      labels:
        # Selected on by the anti-affinity below. It must be a label on the POD
        # TEMPLATE and not the Job: pod anti-affinity matches running pods, and
        # the per-arm job-name label the controller injects is DIFFERENT for each
        # arm, so it cannot express "keep me away from the other arm".
        app: duckdb-cid-bench
    spec:
      restartPolicy: Never
      # starrocks-sa is reused deliberately rather than creating a new role
      serviceAccountName: starrocks-sa
      # run-duckdb-cid.sh can launch the iceberg and paimon arms CONCURRENTLY
      # (FORMAT=both with SUITE=hot, which auto-selects parallel arms — see that
      # script's header for why a live-table suite must not be run serially).
      # Each arm is an independently named Job, so the only thing keeping the two
      # off one node is this anti-affinity. It is load-bearing for the
      # measurement, not for scheduling hygiene: 18 cpu x 2 fits on a 32-vcpu
      # m5.8xlarge by requests, so without it both arms could land together and
      # share one node's memory bandwidth and single NIC — turning the arm
      # comparison into a comparison of two processes fighting over one pipe.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: duckdb-cid-bench
            topologyKey: kubernetes.io/hostname
      nodeSelector:
        kubernetes.io/arch: amd64
        karpenter.sh/nodepool: executor-memorynodepool
        karpenter.k8s.aws/instance-family: m5      # = the family StarRocks' BEs run on
        karpenter.k8s.aws/instance-size: 8xlarge
        karpenter.sh/capacity-type: on-demand
      containers:
      - name: duckdb
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          # duckdb-cli ships the standalone `duckdb` BINARY; the `duckdb` wheel
          # ships only the Python module. BOTH are installed at the SAME version:
          # the CLI runs the queries, and the module is what any ad-hoc follow-up
          # debugging in this pod would use. A version skew between them would
          # mean a reproduction attempt ran a different engine than the
          # measurement.
          #
          # awscli, because the queries are driven by shell: the Iceberg
          # metadata_location comes from `aws glue get-table` per query, the S3
          # credentials from `aws sts assume-role-with-web-identity` (DuckDB's
          # credential_chain cannot consume IRSA — see run-duckdb-cid.sh), and the
          # query suites themselves from `aws s3 sync` of QUERYBENCH_S3 below.
          #
          # awscli 1.x, NOT v2, and that is forced rather than preferred: v2 is
          # not on PyPI at all (`pip install 'awscli>=2'` -> "No matching
          # distribution found"; the index stops at 1.46.x). It ships only as a
          # platform bundle, which on this slim image would mean apt-get install
          # curl unzip plus a ~60 MB download and ./aws/install on EVERY pod
          # start. v2 would also not remove the boto3 line below: it deliberately
          # exposes no Python library, so `import boto3` still fails and the pod
          # would carry v2 AND boto3. Nothing here uses a v2-only feature — the
          # three calls above are identical across both majors.
          #
          # boto3 is for duckdb-cid-bench.py, the interactive debug session,
          # which is NOT the runner and is never executed by this entrypoint. It
          # was unusable in-pod until 2026-10-08: it imports boto3 at module
          # scope and awscli 1.x does not bring it (verified in a clean venv —
          # awscli alone installs NEITHER boto3 nor a top-level botocore, since
          # it VENDORS its own copy at awscli/botocore). That vendoring is also
          # why adding boto3 cannot break the CLI: the two botocores are separate
          # packages, so `aws --version` reporting a different botocore than
          # `pip list` is by design, not a skew. `pip check` is clean.
          #
          # boto3 is deliberately UNPINNED, unlike the two duckdb packages: it is
          # debug-only and off the measured path, so there is no reproducibility
          # claim to protect, and a pin is the one thing that could create a real
          # resolver conflict with whatever botocore range awscli wants later.
          pip install --quiet --no-cache-dir duckdb-cli==1.5.6 duckdb==1.5.6 awscli boto3
          # ONE script, TWO roles. --in-pod selects the benchmark half; the same
          # file run without it is the submitter that created this Job. They were
          # two files until they split the PIN_SNAPSHOT default between them.
          exec bash /opt/bench/run-duckdb-cid.sh --in-pod
        env:
        # Kept even though the runner is now shell: the entrypoint still shells
        # out to python3 for JSON field extraction and for the ===JSON=== payload,
        # and without this Python block-buffers stdout when it is a pipe rather
        # than a tty. The per-run progress lines are the only way to tell a slow
        # scan from a stuck one, so a long run must not look like a hang.
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: AWS_REGION
          value: "us-west-2"
        - name: AWS_DEFAULT_REGION
          value: "us-west-2"
        - name: BUCKET_NAME
          value: "${BUCKET_NAME}"
        - name: ICEBERG_DB
          value: "flink_cid_iceberg_db"
        - name: TABLE_NAME
          value: "cid_events"
        # iceberg = native Iceberg via iceberg_scan (Glue metadata_location).
        # paimon  = the Paimon warehouse's Hive-partitioned parquet via
        #           read_parquet.
        - name: FORMAT
          value: "iceberg"
        - name: SUITE
          value: "all"
        - name: RUNS
          value: "3"
        - name: WARMUP
          value: "1"
        - name: DUCKDB_MEMORY_LIMIT
          value: "56GB"
        - name: DUCKDB_THREADS
          value: "18"          
        # = the cpu limit; StarRocks' aggregate BE cpu
        # Must be set explicitly: for an in-memory database DuckDB has NO default
        # temp_directory, so without it an over-budget query is SIGKILLed instead
        # of spilling and the scratch volume is never written to.
        - name: DUCKDB_TEMP_DIR
          value: "/tmp/duckdb-spill"
        - name: DUCKDB_MAX_TEMP_SIZE
          value: "180GB"
        # THE QUERIES COME FROM S3, NOT FROM A CONFIGMAP. The entrypoint runs
        # `aws s3 sync` from this prefix into BENCH_SQL_DIR at startup, using
        # the awscli installed above and the IRSA role that already reads the
        # warehouse. starrocks-cid-audit.sh syncs the SAME prefix, so one object
        # set is what both engines run; it is published by
        # querybench-script/bench-sql.sh upload.
        #
        # BUCKET_NAME below is the only render-time placeholder in this file,
        # and run-duckdb-cid.sh asserts there are no others — including in
        # comments — so neither name is written in placeholder form here.
        - name: QUERYBENCH_S3
          value: "s3://${BUCKET_NAME}/flink/querybench"
        # Where the sync lands. A writable emptyDir path, not /opt: the suite
        # directories have to be materialised somewhere the entrypoint can
        # write, and bench_query_files() globs them per suite — that glob's
        # lexical order over the H<n>/S<n> prefixes IS the execution order.
        - name: BENCH_SQL_DIR
          value: "/tmp/bench-sql"
        resources:
          requests:
            cpu: "18"
            memory: 72Gi
          limits:
            cpu: "18"
            memory: 72Gi
        volumeMounts:
        - name: bench
          mountPath: /opt/bench
        - name: scratch
          mountPath: /tmp/duckdb-spill
      volumes:
      - name: bench
        configMap:
          # Named for what it holds, not for a language: it carried a Python
          # runner once, and the "-py" suffix outlived that by two rewrites.
          # Dropped here; run-duckdb-cid.sh clean deletes the old name too.
          name: duckdb-cid-bench
      - name: scratch
        ephemeral:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              storageClassName: gp3
              resources:
                requests:
                  storage: 200Gi
