# Raw landing-zone generator — gzipped NDJSON to S3, no Flink.
#
# Rendered by run-jsongz-gen.sh (envsubst over an explicit variable list) to
# jsongz-gen-job-deployed.yaml, which is what gets applied. Every braced $VAR
# below is a render-time placeholder; the script asserts none survive. (Keep
# braced placeholders out of these comments: they would trip that check.)
#
# Job, not Deployment: parallelism JSONGZ_REPLICAS pods, each running WORKERS
# generator processes capped at POD_ROWS_PER_SECOND, so the cluster rate is
# replicas x per-pod rate and `run-jsongz-gen.sh scale N` patches parallelism.
# completions is left unset: the Job is done once a pod succeeds and the rest
# have finished, and no new pods start after that. Pods have no index; each
# seeds its RNG from its own pod name (downward API), so file names cannot
# collide across pods.
#
# Fixed 30-minute window that RELEASES ITS NODES: every pod writes for
# DURATION_SECONDS from its own start, but never past RUN_DEADLINE_EPOCH
# (render time + duration + 600 s for node launch + pip), then EXITS 0. The
# Job completes, its pods are gone, and Karpenter reclaims the nodes; nobody
# has to run `stop`. A pod restarted after the deadline writes nothing and
# exits. activeDeadlineSeconds (duration + slack + 300 s, from the
# run-jsongz-gen.sh start that rendered this file) is only a backstop for a
# pod that hangs past the shared deadline.
#
apiVersion: batch/v1
kind: Job
metadata:
  name: cid-jsongz-gen
  namespace: ${NAMESPACE}
spec:
  parallelism: ${JSONGZ_REPLICAS}
  activeDeadlineSeconds: ${JOB_DEADLINE_SECONDS}
  backoffLimit: 6
  # Keep the finished Job (and its pod logs) for an hour so `status` can
  # still show the DONE lines, then let Kubernetes delete it.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      annotations:
        karpenter.sh/do-not-disrupt: "true"
      labels:
        app: cid-jsongz-gen
    spec:
      # OnFailure: a crashed pod restarts in place; one that finished exits 0.
      restartPolicy: OnFailure
      # SIGTERM stops the workers and flushes in-flight PUTs before exit.
      terminationGracePeriodSeconds: 60
      # IRSA role that already reads/writes the benchmark bucket (same SA as
      # the DuckDB harness).
      serviceAccountName: starrocks-sa
      # One pod per node: WORKERS is sized to a whole node's vCPU, and two pods
      # sharing a NIC/CPU would make the per-pod rate lie.
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: cid-jsongz-gen
      nodeSelector:
        kubernetes.io/arch: amd64
        karpenter.sh/capacity-type: on-demand
        karpenter.sh/nodepool: ${GEN_NODEPOOL}
      containers:
      - name: gen
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          pip install --quiet --no-cache-dir boto3
          exec python3 /opt/gen/cid_jsongz_gen.py
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: AWS_REGION
          value: "${AWS_REGION}"
        - name: AWS_DEFAULT_REGION
          value: "${AWS_REGION}"
        - name: OUTPUT_URI
          value: "${OUTPUT_URI}"
        - name: POD_ROWS_PER_SECOND
          value: "${JSONGZ_ROWS_PER_POD}"
        - name: DURATION_SECONDS
          value: "${DURATION_SECONDS}"
        - name: RUN_DEADLINE_EPOCH
          value: "${RUN_DEADLINE_EPOCH}"
        - name: IDLE_AFTER_DONE
          value: "0"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: WORKERS
          value: "${WORKERS}"
        - name: GZIP_LEVEL
          value: "${GZIP_LEVEL}"
        - name: ROWS_PER_FILE
          value: "${ROWS_PER_FILE}"
        - name: CID_CUSTOMER_COUNT
          value: "${CID_CUSTOMER_COUNT}"
        - name: CID_HOST_COUNT
          value: "${CID_HOST_COUNT}"
        resources:
          requests:
            cpu: "${WORKERS}"
            memory: 24Gi
          limits:
            cpu: "${WORKERS}"
            memory: 24Gi
        volumeMounts:
        - name: gen
          mountPath: /opt/gen
      volumes:
      - name: gen
        configMap:
          name: cid-jsongz-gen
