# Raw landing-zone generator — gzipped NDJSON to S3, no Flink.
#
# Rendered by run-jsongz-gen.sh (envsubst). Every ${VAR} below is a render-time
# placeholder; the script asserts none survive rendering.
#
# Indexed Job: TOTAL_PODS pods, each running WORKERS generator processes. The
# cluster-wide TARGET_ROWS_PER_SECOND is split evenly over TOTAL_PODS x WORKERS
# by the generator itself; each pod learns its index from JOB_COMPLETION_INDEX
# (injected by the Job controller for Indexed Jobs), which seeds its RNG.
#
# Placement: the cluster's Karpenter pools admit no compute-optimized 16xlarge
# (driver-nodepool is c/m up to 8xlarge, executor-memorynodepool is m up to
# 16xlarge), so the default is executor-memorynodepool m6i.16xlarge = 64 vCPU,
# one pod per node at WORKERS=60. The generator is CPU-bound on gzip and needs
# little memory (~150 MB per worker), so m-family only wastes RAM, not speed.
apiVersion: batch/v1
kind: Job
metadata:
  name: cid-jsongz-gen
  namespace: ${NAMESPACE}
spec:
  completionMode: Indexed
  completions: ${TOTAL_PODS}
  parallelism: ${TOTAL_PODS}
  backoffLimit: 0          # a crashed generator must not silently restart and skew the rate
  # Backstop for the fixed 30-min run: DURATION_SECONDS + 300 s (pip install,
  # pod start, final upload flush). Pods exit on their own at DURATION_SECONDS;
  # this only kills a hung one, so nothing writes past the window.
  activeDeadlineSeconds: ${JOB_DEADLINE_SECONDS}
  template:
    metadata:
      annotations:
        karpenter.sh/do-not-disrupt: "true"
      labels:
        app: cid-jsongz-gen
    spec:
      restartPolicy: Never
      # IRSA role that already reads/writes the benchmark bucket (same SA as
      # the DuckDB harness).
      serviceAccountName: starrocks-sa
      # One pod per node: WORKERS is sized to a whole node's vCPU, and two pods
      # sharing a NIC/CPU would make the per-pod rate lie.
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: cid-jsongz-gen
      nodeSelector:
        kubernetes.io/arch: amd64
        karpenter.sh/capacity-type: on-demand
        karpenter.sh/nodepool: ${GEN_NODEPOOL}
        karpenter.k8s.aws/instance-family: ${GEN_INSTANCE_FAMILY}
        karpenter.k8s.aws/instance-size: ${GEN_INSTANCE_SIZE}
      containers:
      - name: gen
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          pip install --quiet --no-cache-dir boto3
          exec python3 /opt/gen/cid_jsongz_gen.py
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: AWS_REGION
          value: "${AWS_REGION}"
        - name: AWS_DEFAULT_REGION
          value: "${AWS_REGION}"
        - name: OUTPUT_URI
          value: "${OUTPUT_URI}"
        - name: TARGET_ROWS_PER_SECOND
          value: "${JSONGZ_ROWS_PER_SECOND}"
        - name: DURATION_SECONDS
          value: "${DURATION_SECONDS}"
        - name: TOTAL_PODS
          value: "${TOTAL_PODS}"
        - name: WORKERS
          value: "${WORKERS}"
        - name: GZIP_LEVEL
          value: "${GZIP_LEVEL}"
        - name: ROWS_PER_FILE
          value: "${ROWS_PER_FILE}"
        - name: CID_CUSTOMER_COUNT
          value: "${CID_CUSTOMER_COUNT}"
        - name: CID_HOST_COUNT
          value: "${CID_HOST_COUNT}"
        resources:
          requests:
            cpu: "${WORKERS}"
            memory: 24Gi
          limits:
            cpu: "${WORKERS}"
            memory: 24Gi
        volumeMounts:
        - name: gen
          mountPath: /opt/gen
      volumes:
      - name: gen
        configMap:
          name: cid-jsongz-gen
