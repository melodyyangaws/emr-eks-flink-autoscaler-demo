# gp3 at its maximum throughput, for warm DuckDB's on-disk block cache
# (duckdb-warm.yaml, CACHE_MODE=on_disk). Same as the cluster's `gp3` class
# except speed: default gp3 is 3000 IOPS / 125 MB/s, which held DuckDB's cache
# reads at 130 MB/s with 0 MB/s from S3 (2026-10-17), because cache_httpfs has
# no way to fall back to S3. StarRocks' BEs stay on `gp3`: their datacache
# sends reads back to S3 when the disk saturates (enable_datacache_io_adaptor).
# 1000 MB/s needs >= 4000 IOPS (0.25 MB/s per IOPS); 16000 is the gp3 maximum.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3-fast
  labels: {app: duckdb-warm}
parameters:
  encrypted: "true"
  fstype: ext4
  type: gp3
  iops: "16000"
  throughput: "1000"
provisioner: ebs.csi.aws.com
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: false
